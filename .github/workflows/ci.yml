name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sryg
          POSTGRES_PASSWORD: sryg
          POSTGRES_DB: sryg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sryg -d sryg_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://sryg:sryg@localhost:5432/sryg_test
      DATABASE_MIGRATION_URL: postgres://sryg:sryg@localhost:5432/sryg_test
      JWT_SECRET: ci-only-jwt-secret-at-least-32-bytes-long
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build:packages
      - run: pnpm -r typecheck
      - run: pnpm db:migrate
      - run: pnpm -r test
      - run: pnpm build
