<title>Ruta de Defensa SRYG</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: un mapa isométrico "cozy" arriba (la isla SRYG) y, al entrar a una zona, un cuaderno de estudio con tarjetas, preguntas de jurado y un quiz. */
:root{
  --bg:#eaf3e4; --bg-2:#dcebd2; --surface:#fffdf7; --surface-2:#f3efe2; --fg:#23311f; --fg-2:#5a6b52; --line:#cfdcc3;
  --accent:#2f7d4e; --accent-2:#e2a93b; --accent-ink:#fff; --danger:#c8463a; --sky-1:#cfe7f3; --sky-2:#eaf3e4;
  --card:#fff; --xp:#e2a93b; --ok:#2f7d4e; --bad:#c8463a; --shadow:0 10px 30px rgba(40,60,30,.12);
  --font-display:'Fredoka','Trebuchet MS',sans-serif; --font-body:'Nunito','Segoe UI',system-ui,sans-serif; --font-mono:ui-monospace,'Cascadia Mono','JetBrains Mono',Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111a16; --bg-2:#172420; --surface:#1b2722; --surface-2:#223029; --fg:#e8efe4; --fg-2:#a9b8a4; --line:#2f3f36;
  --accent:#6fcf97; --accent-2:#f0c060; --accent-ink:#0f1a14; --danger:#ff7b6b; --sky-1:#0e1b2b; --sky-2:#111a16;
  --card:#1b2722; --xp:#f0c060; --ok:#6fcf97; --bad:#ff7b6b; --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#111a16; --bg-2:#172420; --surface:#1b2722; --surface-2:#223029; --fg:#e8efe4; --fg-2:#a9b8a4; --line:#2f3f36;
  --accent:#6fcf97; --accent-2:#f0c060; --accent-ink:#0f1a14; --danger:#ff7b6b; --sky-1:#0e1b2b; --sky-2:#111a16;
  --card:#1b2722; --xp:#f0c060; --ok:#6fcf97; --bad:#ff7b6b; --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-block:12px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(26px,4vw,38px);font-weight:700}
h2{font-size:clamp(20px,3vw,26px);font-weight:600}
h3{font-size:17px;font-weight:600}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
code{font-family:var(--font-mono);font-size:.9em;background:var(--surface-2);padding:1px 5px;border-radius:5px}
pre{font-family:var(--font-mono);font-size:12.5px;line-height:1.5;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto;margin:0}
.sr{position:absolute;left:-9999px}
:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px;border-radius:8px}

/* HUD */
.hud{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.hud .who{display:flex;gap:12px;align-items:center;min-width:0}
.hud .avatar{width:46px;height:46px;border-radius:50%;background:var(--accent);display:grid;place-items:center;flex:none}
.hud .avatar svg{width:30px;height:30px}
.hud .title{font-family:var(--font-display);font-size:19px;font-weight:600}
.hud .rank{color:var(--fg-2);font-size:13px}
.xpbar{flex:1 1 240px;min-width:0}
.xpbar .lab{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-2);font-weight:700}
.xpbar .bar{height:12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin-top:4px}
.xpbar .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));width:0;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;font-size:15px;opacity:.35;filter:grayscale(1)}
.badge.on{opacity:1;filter:none;background:var(--accent-2);border-color:transparent}
.hud .tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:5px 10px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* MAPA */
.hero{display:grid;grid-template-columns:1fr;gap:14px;margin-top:16px}
.intro{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;justify-content:space-between}
.intro .lead{max-width:62ch;color:var(--fg-2)}
.mapbox{position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,var(--sky-1),var(--sky-2));border:1px solid var(--line);box-shadow:var(--shadow)}
.mapbox svg{display:block;width:100%;height:auto;max-width:100%}
.zone{cursor:pointer}
.zone .lbl{font-family:var(--font-display);font-weight:600;font-size:15px;fill:#1d2a1c}
.zone .lblbg{fill:#fffdf7;stroke:#8a7a55;stroke-width:1.5}
.zone:hover .lblbg,.zone:focus .lblbg{fill:#ffe9a8}
.zone:focus{outline:none}
.zone .pbar{fill:#d9d2bf}.zone .pfill{fill:#2f7d4e}
.zone .done{fill:#e2a93b}
.hero-char{animation:bob 1.4s ease-in-out infinite;transform-origin:0 0}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.hud .avatar img{width:46px;height:46px;object-fit:cover;object-position:top;border-radius:50%;background:#fff}
.npc{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.npc .face{width:52px;height:52px;flex:none;border-radius:14px;background:var(--accent-2);display:grid;place-items:center}
.npc .face svg{width:40px;height:40px}
.npc .name{font-family:var(--font-display);font-weight:600;font-size:14px;color:var(--fg-2)}
.npc .say{font-style:italic}
.zonelist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:14px}
.zcard{text-align:left;display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);background:var(--surface);border-radius:14px}
.zcard:hover{background:var(--surface-2)}
.zcard .ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--surface-2)}
.zcard .t{font-family:var(--font-display);font-weight:600}
.zcard .s{font-size:12.5px;color:var(--fg-2)}
.zcard .pct{margin-left:auto;font-family:var(--font-display);font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.zcard.locked{opacity:.55}

/* ZONA */
.zone-view{margin-top:16px;display:grid;gap:16px}
.zhead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.zhead .kicker{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--fg-2)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:4px;background:var(--surface-2);border-radius:14px;width:fit-content;max-width:100%}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:10px;font-weight:700;color:var(--fg-2)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.panel{display:grid;gap:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{display:flex;gap:8px;align-items:center}
.card .num{font-family:var(--font-display);font-size:12px;background:var(--surface-2);border-radius:8px;padding:2px 7px;color:var(--fg-2)}
.card ul{margin:0;padding-left:18px;display:grid;gap:4px}
.card .why{border-left:3px solid var(--accent-2);padding:6px 10px;background:var(--surface-2);border-radius:0 8px 8px 0;font-size:14px}
.card .why b{color:var(--accent)}
.card .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card.read{border-color:var(--accent)}
.card.read .foot .btn{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-2)}
.jury{display:grid;gap:10px}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.q summary{cursor:pointer;font-weight:700;display:flex;gap:10px;align-items:flex-start}
.q summary::marker{content:''}
.q summary .ask{flex:none;width:28px;height:28px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-family:var(--font-display);font-size:13px;color:var(--fg-2)}
.q.product summary .ask{background:#f3dfb2;color:#6b4e12}.q.tech summary .ask{background:#cfe6d8;color:#1d4d32}
.q .ans{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:grid;gap:8px}
.q .ans .tip{font-size:13px;color:var(--fg-2)}
.q .grade{display:flex;gap:8px;flex-wrap:wrap}
.q.ok{border-color:var(--ok)}
.quiz{display:grid;gap:12px}
.qq{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:10px}
.qq .opts{display:grid;gap:6px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;display:flex;gap:10px;align-items:flex-start}
.opt .k{font-family:var(--font-display);font-weight:600;color:var(--fg-2);flex:none}
.opt:hover{background:var(--surface-2)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.qq .exp{font-size:14px;border-left:3px solid var(--accent);padding:6px 10px;background:var(--surface-2);border-radius:0 8px 8px 0}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:all .35s;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--surface-2);border:1px solid var(--line)}
.pill.xp{background:var(--xp);color:#3a2a05;border-color:transparent}
.boss{display:grid;gap:12px}
.boss .arena{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px}
.boss .flash{min-height:140px;display:grid;gap:10px;align-content:start}
.boss .flash .qtext{font-family:var(--font-display);font-size:20px}
.boss .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.score .s{background:var(--surface-2);border-radius:12px;padding:10px;text-align:center}
.score .s b{font-family:var(--font-display);font-size:24px;display:block;font-variant-numeric:tabular-nums}
.note{font-size:13.5px;color:var(--fg-2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:640px){.hud .title{font-size:16px}.tab{padding:7px 10px;font-size:13.5px}}
</style>
<div class="wrap">
  <header class="hud" id="hud">
    <div class="who">
      <div class="avatar" aria-hidden="true"><svg viewBox="0 0 32 32"><circle cx="16" cy="12" r="6" fill="#fff"/><path d="M5 29c1-7 6-10 11-10s10 3 11 10z" fill="#fff"/></svg></div>
      <div style="min-width:0">
        <div class="title">Junco · <span id="rank">Aspirante</span></div>
        <div class="rank" id="rankhint">Ruta de Defensa SRYG · Tesis IUPSM 2026</div>
      </div>
    </div>
    <div class="xpbar"><div class="lab"><span id="xplab">0 XP</span><span id="nextlab">siguiente rango: 150 XP</span></div><div class="bar"><i id="xpfill"></i></div></div>
    <div class="badges" id="badges" aria-label="Insignias por zona"></div>
    <div class="tools">
      <button class="btn small" id="btnHome" hidden>↩ Mapa</button>
      <label class="btn small" for="avatarFile" title="Carga una imagen PNG o JPG; se guarda solo en este navegador">🧑‍✈️ Personaje</label>
      <input type="file" id="avatarFile" accept="image/png,image/jpeg,image/webp" class="sr">
      <button class="btn small" id="btnReset" title="Borra el progreso guardado en este navegador">Reiniciar</button>
    </div>
  </header>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
// ===== Motor del mapa isométrico (SVG generado) =====
const MAP = (() => {
  const TW = 64, TH = 32, N = 15;           // tamaño de losa y dimensión de la grilla
  let seed = 20261015;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296 };
  const iso = (x, y) => [ (x - y) * TW / 2, (x + y) * TH / 2 ];
  // Forma de la isla: una elipse con bordes irregulares
  const inIsland = (x, y) => {
    const cx = 7, cy = 7, dx = (x - cx) / 7.2, dy = (y - cy) / 7.2;
    const wob = 0.9 + 0.18 * Math.sin(x * 1.7 + y * 0.9) + 0.12 * Math.cos(y * 2.3 - x * 0.7);
    return dx * dx + dy * dy < wob;
  };
  // Río: baja desde el norte hasta el sureste
  const river = new Set();
  for (let y = 0; y < N; y++) { const x = Math.round(6 + 2.2 * Math.sin(y * 0.55) + y * 0.22); river.add(x + ',' + y); if (y % 3 === 1) river.add((x + 1) + ',' + y); }
  // Zonas y sus losas (x,y)
  const ZONES_POS = { taquilla:[3,4], archivo:[9,2], torre:[11,6], hangar:[12,10], pista:[8,12], boveda:[3,10], rampa:[4,7], academia:[10,8], jurado:[7,9] };
  const zoneTiles = new Set(Object.values(ZONES_POS).map(p => p.join(',')));
  // Caminos: unir cada zona con la siguiente en el orden de estudio
  const ORDER = ['taquilla','archivo','torre','hangar','pista','boveda','rampa','academia','jurado'];
  const path = new Set();
  const walk = (a, b) => { let [x, y] = a; const [tx, ty] = b; while (x !== tx || y !== ty) { if (x !== tx && (y === ty || rnd() < .5)) x += Math.sign(tx - x); else y += Math.sign(ty - y); path.add(x + ',' + y); } };
  for (let i = 0; i < ORDER.length - 1; i++) walk(ZONES_POS[ORDER[i]], ZONES_POS[ORDER[i + 1]]);
  const C = { grass:['#8fd16a','#7cc257','#a4dc82'], cliff:['#b98d5c','#8c6a44'], stone:'#6f6f66', water:'#5fb7d9', waterDeep:'#3f98bd', path:'#e6d4a3', bridge:'#a77a4c', pine:['#2f7d4e','#246b41'], leaf:['#4aa65f','#3c9150','#67b870'], trunk:'#7a5230', flower:['#f1655a','#f4c542','#ffffff','#e37ad1'] };
  const poly = (pts, fill, extra = '') => `<polygon points="${pts.map(p => p.join(',')).join(' ')}" fill="${fill}" ${extra}/>`;
  const diamond = (sx, sy, dy = 0) => [[sx, sy - TH / 2 + dy], [sx + TW / 2, sy + dy], [sx, sy + TH / 2 + dy], [sx - TW / 2, sy + dy]];
  function tree(sx, sy, kind) {
    const ox = (rnd() - .5) * 18, oy = (rnd() - .5) * 8; sx += ox; sy += oy;
    if (kind === 'pine') return `<rect x="${sx - 2}" y="${sy - 8}" width="4" height="9" fill="${C.trunk}"/>` + poly([[sx, sy - 34], [sx + 10, sy - 14], [sx - 10, sy - 14]], C.pine[0]) + poly([[sx, sy - 26], [sx + 12, sy - 6], [sx - 12, sy - 6]], C.pine[1]);
    const s = 7 + rnd() * 4;
    return `<rect x="${sx - 2}" y="${sy - 8}" width="4" height="9" fill="${C.trunk}"/><circle cx="${sx}" cy="${sy - 14}" r="${s + 2}" fill="${C.leaf[1]}"/><circle cx="${sx - 4}" cy="${sy - 17}" r="${s}" fill="${C.leaf[0]}"/><circle cx="${sx + 4}" cy="${sy - 16}" r="${s - 1}" fill="${C.leaf[2]}"/>`;
  }
  function house(sx, sy, col, roof) {
    // casita isométrica: dos muros, techo a dos aguas, puerta y ventana
    const w = 22, h = 18, d = 14;
    const s = [];
    s.push(poly([[sx - w, sy - h], [sx, sy - h + d / 1.1], [sx, sy + 4], [sx - w, sy - d / 1.1 + 4]], col[0]));
    s.push(poly([[sx, sy - h + d / 1.1], [sx + w, sy - h], [sx + w, sy - d / 1.1 + 4], [sx, sy + 4]], col[1]));
    s.push(poly([[sx - w - 3, sy - h], [sx - 11, sy - h - 20], [sx + 11 - 1, sy - h - 20 + 8], [sx, sy - h + d / 1.1 + 3]], roof[0]));
    s.push(poly([[sx, sy - h + d / 1.1 + 3], [sx + 11 - 1, sy - h - 20 + 8], [sx + 22 + 3, sy - h], [sx + w, sy - h]], roof[1]));
    s.push(poly([[sx - 11, sy - h - 20], [sx + 10, sy - h - 12], [sx + 11, sy - h - 20 + 8]], roof[0]));
    s.push(`<rect x="${sx + 6}" y="${sy - 10}" width="7" height="11" rx="2" fill="#5b3a1e"/><rect x="${sx - 15}" y="${sy - 13}" width="6" height="6" rx="1" fill="#ffe9a8"/>`);
    return s.join('');
  }
  function build(zones, progress, avatarSrc) {
    const out = []; const deco = []; const labels = [];
    // El personaje de Junco camina hasta la primera zona que aún no está completa
    const cur = zones.find(z => progress(z.id) < 100) || zones[zones.length - 1];
    if (avatarSrc) { const [ax, ay] = ZONES_POS[cur.id]; const [asx, asy] = iso(ax, ay); labels.push(`<g transform="translate(${asx + 34},${asy + 6})"><ellipse cx="0" cy="2" rx="14" ry="5" fill="rgba(0,0,0,.18)"/><g class="hero-char"><image href="${avatarSrc}" x="-26" y="-74" width="52" height="76" preserveAspectRatio="xMidYMax" onerror="this.closest('g').remove()"/></g></g>`); }
    let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    const tiles = [];
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (inIsland(x, y)) tiles.push([x, y]);
    tiles.sort((a, b) => (a[0] + a[1]) - (b[0] + b[1]) || a[1] - b[1]);
    const isIn = (x, y) => inIsland(x, y) && x >= 0 && y >= 0 && x < N && y < N;
    for (const [x, y] of tiles) {
      const k = x + ',' + y; const [sx, sy] = iso(x, y);
      minX = Math.min(minX, sx - TW / 2); maxX = Math.max(maxX, sx + TW / 2); minY = Math.min(minY, sy - TH / 2 - 60); maxY = Math.max(maxY, sy + TH / 2 + 46);
      const isWater = river.has(k), isPath = path.has(k) || zoneTiles.has(k);
      // acantilado: caras visibles hacia el sur-este y sur-oeste
      const dz = 40;
      if (!isIn(x + 1, y)) { out.push(poly([[sx + TW / 2, sy], [sx, sy + TH / 2], [sx, sy + TH / 2 + dz], [sx + TW / 2, sy + dz]], C.cliff[1])); out.push(poly([[sx + TW / 2, sy + 26], [sx, sy + TH / 2 + 26], [sx, sy + TH / 2 + dz], [sx + TW / 2, sy + dz]], C.stone)); }
      if (!isIn(x, y + 1)) { out.push(poly([[sx - TW / 2, sy], [sx, sy + TH / 2], [sx, sy + TH / 2 + dz], [sx - TW / 2, sy + dz]], C.cliff[0])); out.push(poly([[sx - TW / 2, sy + 26], [sx, sy + TH / 2 + 26], [sx, sy + TH / 2 + dz], [sx - TW / 2, sy + dz]], C.stone)); }
      if (isWater && isPath) { out.push(poly(diamond(sx, sy, 6), C.waterDeep)); out.push(poly(diamond(sx, sy, 2), C.bridge)); out.push(`<line x1="${sx - 20}" y1="${sy - 6}" x2="${sx + 20}" y2="${sy + 14}" stroke="#7a5230" stroke-width="2"/>`); }
      else if (isWater) { out.push(poly(diamond(sx, sy, 6), C.waterDeep)); out.push(poly(diamond(sx, sy, 3), C.water)); out.push(`<path d="M${sx - 14} ${sy + 3} q6 -3 12 0 t12 0" stroke="#dff4fb" stroke-width="1.6" fill="none" opacity=".8"/>`); }
      else if (isPath) { out.push(poly(diamond(sx, sy), C.grass[0])); out.push(poly(diamond(sx, sy).map(([px, py]) => [sx + (px - sx) * .72, sy + (py - sy) * .72]), C.path)); }
      else {
        out.push(poly(diamond(sx, sy), C.grass[(x * 3 + y * 5) % 3]));
        const r = rnd();
        if (r < .22 && !zoneTiles.has((x + 1) + ',' + y) && !zoneTiles.has(x + ',' + (y + 1))) deco.push([sy, tree(sx, sy, r < .09 ? 'pine' : 'round')]);
        else if (r < .3) deco.push([sy - 1, `<circle cx="${sx + (rnd() - .5) * 26}" cy="${sy + (rnd() - .5) * 10}" r="2.2" fill="${C.flower[(x + y) % 4]}"/>`]);
        else if (r < .34) deco.push([sy - 1, `<ellipse cx="${sx + (rnd() - .5) * 20}" cy="${sy}" rx="7" ry="4" fill="#9a9a90"/><ellipse cx="${sx + (rnd() - .5) * 20 - 2}" cy="${sy - 2}" rx="4" ry="2.5" fill="#c2c2b6"/>`]);
      }
    }
    for (const z of zones) {
      const [x, y] = ZONES_POS[z.id]; const [sx, sy] = iso(x, y);
      const pct = progress(z.id);
      deco.push([sy + 2, house(sx, sy, z.walls, z.roof)]);
      const lw = Math.max(96, z.name.length * 8.4 + 30);
      labels.push(`<g class="zone" data-zone="${z.id}" role="button" tabindex="0" aria-label="${z.name}: ${pct}% completado" transform="translate(${sx},${sy - 62})">
        <title>${z.name} · ${z.tag}</title>
        <rect class="lblbg" x="${-lw / 2}" y="-16" width="${lw}" height="32" rx="12"/>
        <text class="lbl" x="${-lw / 2 + 10}" y="2" dominant-baseline="middle">${z.icon} ${z.name}</text>
        <rect class="pbar" x="${-lw / 2 + 8}" y="9" width="${lw - 16}" height="4" rx="2"/>
        <rect class="pfill" x="${-lw / 2 + 8}" y="9" width="${(lw - 16) * pct / 100}" height="4" rx="2"/>
        ${pct >= 100 ? `<circle class="done" cx="${lw / 2 - 2}" cy="-14" r="8"/><text x="${lw / 2 - 2}" y="-13" text-anchor="middle" dominant-baseline="middle" font-size="10">★</text>` : ''}
        <polygon points="-6,16 6,16 0,24" fill="#fffdf7" stroke="#8a7a55" stroke-width="1.5"/>
      </g>`);
    }
    deco.sort((a, b) => a[0] - b[0]);
    const vb = `${minX - 10} ${minY - 10} ${maxX - minX + 20} ${maxY - minY + 20}`;
    return `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-labelledby="mapTitle" role="group"><title id="mapTitle">Isla SRYG: el mapa de estudio</title>
      <ellipse cx="${(minX + maxX) / 2}" cy="${maxY - 20}" rx="${(maxX - minX) / 2}" ry="26" fill="rgba(0,0,0,.14)"/>
      ${out.join('')}${deco.map(d => d[1]).join('')}${labels.join('')}</svg>`;
  }
  return { build, ORDER };
})();
</script>
<script>
// ===== Contenido: chistes y zonas 1-2 =====
const JOKES = {

    'Tranquilo, con este repaso vas a llegar más preparado que venezolano en cola de gasolina: con tiempo, paciencia y un termo de guayoyo.',
    'Si el jurado te pregunta por ACID, no es el Gold de Pampero, ¿oíste? Atomicidad, Consistencia, Aislamiento, Durabilidad.',

};
const ZONES = [];

ZONES.push({
  id:'taquilla', name:'La Taquilla', icon:'🏢', tag:'Producto, problema y tesis (Capítulo I)', walls:['#f1dcb4','#d9bf8e'], roof:['#c8463a','#a9362c'],
  intro:'La puerta de entrada: qué problema resuelve SRYG, para quién, con qué alcance y por qué INAC Maracay. Si no dominas esta zona, el jurado de producto te la cobra.',
  jokes:['Bienvenido a la Taquilla Técnica. Aquí antes buscaban un expediente en una carpeta física y tardaban más que el CANTV en reconectar.','Si el jurado de producto pregunta "¿y esto para qué?", respondes con el problema, no con el stack. El stack es el relleno, no la arepa.'],
  cards:[
    { t:'Ficha de la tesis', b:`<ul><li><b>Título:</b> Desarrollo de un Sistema Automatizado para la Gestión de Credenciales del Personal Aeronáutico del INAC, oficina de Maracay, Edo. Aragua.</li><li><b>Autor:</b> Fernando Andrés Junco Spallone. <b>Tutora académica:</b> Dra. Jeazmín Pérez. <b>Asesor metodológico:</b> Lcdo. Miguel Mora.</li><li><b>Institución:</b> IUP Santiago Mariño, extensión Maracay. Ingeniería de Sistemas. Julio 2026.</li><li><b>Línea:</b> Sistemas de Información Transaccionales. <b>Eje:</b> Aplicaciones Cliente-Servidor.</li><li><b>Descriptores:</b> sistema automatizado, gestión de credenciales, PostgreSQL, TypeScript, Modelo en Cascada.</li></ul>`, src:'thesis.docx, portada y resumen' },
    { t:'El problema en una frase', b:`<p>INAC Maracay controla licencias, habilitaciones y certificados médicos con <b>expedientes físicos y hojas de cálculo locales</b>. Eso produce latencia en consultas, errores tipográficos, registros duplicados, fiscalización débil en inspecciones de rampa y el riesgo de que alguien opere con credenciales vencidas o impedimentos no detectados.</p><ul><li><b>Causas:</b> (1) no hay plataforma centralizada, (2) métodos manuales sin estatus en tiempo real, (3) no hay validación ni alertas automáticas.</li><li><b>Consecuencias:</b> sanciones OACI, incidentes con personal no apto, pérdida de trazabilidad en auditorías, decisiones gerenciales sin datos.</li></ul>`, why:'El jurado quiere oír el problema antes que la solución. Cita el marco: OACI Anexo 1, RAV 60 (licencias) y RAV 67 (certificados médicos) exigen control riguroso de vigencia y disponibilidad inmediata de la información.', src:'thesis.docx, Cap. I planteamiento' },
    { t:'Objetivo general y específicos', b:`<p><b>General:</b> desarrollar un sistema automatizado para la gestión de credenciales del personal aeronáutico del INAC.</p><ol style="margin:0;padding-left:18px"><li><b>Diagnosticar</b> la situación actual de registro y control de credenciales en INAC Maracay.</li><li><b>Determinar</b> los requerimientos funcionales y no funcionales.</li><li><b>Diseñar</b> la arquitectura de la base de datos y la interfaz, asegurando integridad y relación de datos.</li><li><b>Programar</b> los módulos con lenguajes y un SGBD que garanticen funcionalidad y escalabilidad.</li><li><b>Validar</b> el funcionamiento mediante pruebas de usuario contra los requerimientos y normativas.</li></ol>`, why:'Cada objetivo específico se corresponde con una fase de la cascada y con una pregunta de investigación. Si te preguntan "¿cómo cumpliste el objetivo 3?", apuntas a las 26 tablas, las restricciones y los 6 templates de UI.', src:'thesis.docx, Cap. I objetivos' },
    { t:'Alcance: seis módulos, tres exclusiones', b:`<ul><li>Registro y administración del personal aeronáutico (foto, tipo de sangre, cédula, cargos, dependencias, estatus).</li><li>Control de licencias y habilitaciones técnicas (RAV 60): emisión, vencimiento, historial, próximas a vencer.</li><li>Gestión <b>administrativa</b> de certificados médicos (RAV 67, clases 1, 2 y 3): tipo, fechas y restricciones operativas. Nunca diagnósticos.</li><li>Validación de estatus con <b>alerta de bloqueo</b> que impide emitir mientras exista un impedimento administrativo, médico o regulatorio.</li><li>Reportes y auditoría: quién cambió qué y cuándo.</li><li>Seguridad y control de acceso: perfiles administrador, supervisor y consulta; respaldos.</li></ul><p><b>Fuera de alcance:</b> evaluación médica clínica, otras áreas del INAC (finanzas, materiales, contratación, capacitación no ligada a licencias) y otras sedes distintas a Maracay.</p>`, why:'La delimitación es una defensa en sí misma: cuando te pregunten "¿por qué no incluiste X?", respondes con la delimitación temática y espacial declarada en el Capítulo I.', src:'thesis.docx, alcance y propósito' },
    { t:'Los 9 usuarios reales y sus roles', b:`<div class="tbl"><table><tr><th>Estrato (censo)</th><th>Personas</th><th>Postura de uso</th><th>Rol en SRYG</th></tr><tr><td>Funcionarios de Taquilla Técnica de Licencias</td><td>4</td><td>Escritorio, alto volumen, teclado</td><td>Administrador</td></tr><tr><td>Supervisores de la Gerencia de Seguridad Aeronáutica</td><td>2</td><td>Oficina: alertas, bloqueos, reportes</td><td>Supervisor</td></tr><tr><td>Inspectores de Seguridad Aeronáutica en Rampa</td><td>3</td><td>Tablet o teléfono, en campo, solo lectura</td><td>Consulta</td></tr></table></div><p>La Directiva consume reportes pero no es usuaria diaria. La correspondencia persona→rol es una <b>inferencia documentada</b> pendiente de confirmación con INAC (OD-14).</p>`, why:'Los personas no son decorativas: la UI densa de escritorio y los controles táctiles de 44 px en tablet salen directamente de estas tres posturas.', src:'PRODUCT.md, Cuadro 3 de la tesis' },
    { t:'Justificación en cuatro planos', b:`<ul><li><b>Técnica:</b> centralizar con arquitectura cliente-servidor, integridad referencial, verificación automática y alertas tempranas, imposibles con métodos manuales.</li><li><b>Teórica:</b> sistemas de información transaccionales (Kendall y Kendall, 2019) y propiedades ACID de las bases relacionales (Silberschatz, Korth y Sudarshan, 2020); marco normativo RAV 60, RAV 67 y Anexo 1 OACI.</li><li><b>Metodológica:</b> proyecto factible con fases de diagnóstico, diseño, desarrollo y validación.</li><li><b>Social:</b> seguridad operacional de la aviación civil en la región Aragua y cumplimiento de compromisos ante la OACI.</li></ul>`, src:'thesis.docx, justificación' },
    { t:'Cinco principios de producto', b:`<ol style="margin:0;padding-left:18px"><li><b>El estatus es el producto.</b> Cada pantalla responde primero "¿esta persona puede operar?".</li><li><b>Un bloqueo es un estado, no un error.</b> Se nombra el impedimento y qué lo resuelve.</li><li><b>Nunca almacenar ni inventar lo que la norma no permite.</b> Sin datos clínicos, sin números regulatorios adivinados.</li><li><b>Toda acción deja rastro.</b> Quién, cuándo y enlace a la auditoría.</li><li><b>Diseñado para la postura real de cada usuario.</b> Denso en escritorio, grande y táctil en rampa.</li></ol>`, why:'Estos principios son la respuesta corta a casi cualquier pregunta de producto sobre "por qué la pantalla es así".', src:'apps/web/PRODUCT.md' },
    { t:'SRYG frente a SLYM (el sistema actual del INAC)', b:`<p>Durante el diagnóstico se revisó SLYM en grabaciones de pantalla (14/10/2026). Sus catálogos reales (42 tipos de licencia, 281 habilitaciones de tipo, 97 aeronaves, 203 observaciones) se transcribieron y limpiaron a <code>docs/slym-catalogos</code> y alimentan el seed.</p><p><b>Lo que SRYG añade sobre SLYM:</b> bloqueos con resolución formal, regla de coherencia licencia↔certificado médico, alertas de vencimiento, visor de auditoría inmutable, reportes para la Directiva y verificación pública por QR.</p>`, why:'Demuestra que el diagnóstico fue de campo y que la propuesta no reinventa lo que ya existe: lo mejora en control y trazabilidad.', src:'docs/plan-ejecucion-paralela.md §2.2, docs/slym-catalogos' },
  ],
  jury:[
    { k:'P', q:'¿Por qué solo la oficina de Maracay y no todo el INAC?', a:`<p>Por delimitación espacial declarada: Maracay supervisa al personal de la región central (pilotos, tripulantes, técnicos y controladores de los aeropuertos y centros de control de su jurisdicción). Es una población accesible, finita y de la cual se obtuvo información diagnóstica directa. El diseño es portable: no hay nada en el modelo de datos que impida otra sede, pero el alcance multi-sede se registró como decisión abierta (OD-13) para no inventar requisitos que nadie validó.</p>`, tip:'Cierra con: "primero validar en una sede, luego escalar".' },
    { k:'P', q:'¿Qué pasa hoy si un piloto tiene el certificado médico vencido y nadie lo nota?', a:`<p>Con el proceso manual, nada lo detiene: el dato vive en una carpeta o una hoja de cálculo. Con SRYG, el estatus se deriva automáticamente a partir de la fecha de vencimiento y el umbral configurado, aparece como "Vencida" en el expediente, genera una alerta en el panel y, si alguien intenta emitir una licencia que exige esa clase médica, el sistema rechaza el trámite por la regla de coherencia (BR-09). Además, un inspector de rampa puede verificar el estado en segundos desde el teléfono.</p>` },
    { k:'P', q:'¿En qué se diferencia esto de una buena hoja de cálculo compartida?', a:`<p>En cuatro cosas que una hoja no da: (1) reglas que se aplican solas (bloqueo en emisión, coherencia RAV 67, vencimiento calculado), (2) control de acceso por rol y área, (3) auditoría inmutable de cada cambio con actor y fecha, y (4) concurrencia segura: nueve personas trabajando a la vez sin pisarse, gracias a transacciones ACID y MVCC de PostgreSQL.</p>` },
    { k:'P', q:'¿Por qué el sistema no guarda diagnósticos médicos?', a:`<p>Porque la evaluación clínica es competencia exclusiva del médico examinador autorizado; el INAC solo administra el resultado. Es una decisión de alcance (fuera: evaluación médica clínica) y una regla de negocio (BR-05): el certificado guarda clase, número, fechas y restricciones operativas generales. En el código los esquemas de entrada son estrictos y rechazan cualquier campo extra, y un test de esquema verifica que la tabla no tenga columnas clínicas.</p>` },
    { k:'P', q:'¿Cuál es el aporte de tu trabajo?', a:`<p>Convertir dos regulaciones (RAV 60 y RAV 67) en reglas ejecutables dentro de un sistema transaccional: validación automática de estatus, bloqueo preventivo en emisión y renovación, alertas tempranas y trazabilidad completa, para una oficina que hoy trabaja en papel. Aporta además un diagnóstico de campo con los nueve funcionarios y un modelo de datos con integridad referencial que impide credenciales sin titular.</p>` },
    { k:'P', q:'¿Quiénes son tus usuarios y cómo los involucraste?', a:`<p>Nueve funcionarios de la Gerencia General de Seguridad Aeronáutica de la sede Maracay: cuatro de Taquilla Técnica, dos supervisores y tres inspectores de rampa. Se les aplicó un cuestionario dicotómico de diez ítems (censo total) y se observó directamente el trabajo en taquilla. Sus tres posturas de uso (escritorio denso, oficina de supervisión, campo con tablet) definieron los roles y el diseño responsive.</p>` },
  ],
  quiz:[
    { q:'¿Qué regulación venezolana norma los certificados médicos aeronáuticos?', o:['RAV 60','RAV 67','RAV 91','Anexo 6 OACI'], a:1, e:'RAV 67 rige los certificados médicos; RAV 60 rige las licencias al personal.' },
    { q:'¿Cuántos funcionarios conforman la población del estudio?', o:['12','9','25','4'], a:1, e:'Nueve: 4 de taquilla, 2 supervisores y 3 inspectores de rampa, con censo totalitario.' },
    { q:'¿Qué queda explícitamente fuera del alcance?', o:['La emisión de licencias','La evaluación médica clínica','Los reportes para la Directiva','El control de habilitaciones'], a:1, e:'La evaluación clínica es del médico examinador; SRYG solo registra el resultado administrativo.' },
    { q:'¿Cuál es la línea de investigación de la tesis?', o:['Inteligencia artificial','Sistemas de Información Transaccionales','Redes y telecomunicaciones','Sistemas embebidos'], a:1, e:'Línea: Sistemas de Información Transaccionales; eje temático: Aplicaciones Cliente-Servidor.' },
    { q:'¿Qué rol se propone para los inspectores de rampa?', o:['Administrador','Supervisor','Consulta','Auditor'], a:2, e:'Consulta: solo lectura, desde tablet o teléfono, en campo.' },
    { q:'Según el principio de producto, un bloqueo es...', o:['Un error 500','Un estado que nombra el impedimento','Una notificación por correo','Un campo oculto'], a:1, e:'"Un bloqueo es un estado, no un error": la pantalla nombra el impedimento y qué lo resuelve.' },
  ],
});

ZONES.push({
  id:'archivo', name:'El Archivo', icon:'📜', tag:'Dominio y reglas de negocio', walls:['#e9e3cf','#cfc7ad'], roof:['#5b7f9a','#44637a'],
  intro:'Aquí viven las entidades, los estados y las reglas BR-01 a BR-14. Es el puente entre la regulación y el código: cada regla tiene un sitio donde se ejecuta.',
  jokes:['Las reglas de negocio son como las normas de la abuela: nadie las discute y todas tienen un porqué.','"Vigente, próxima a vencer, vencida, bloqueada": es como el estatus de la relación, pero con fechas.'],
  cards:[
    { t:'Las entidades del dominio', b:`<ul><li><b>PersonalAeronautico:</b> cédula, nombres, contacto, foto y firma, tipo de sangre, cargo, dependencia, categoría RAV 60, estatus.</li><li><b>Licencia:</b> tipo (catálogo), número, fecha de emisión, vencimiento calculado, token de verificación.</li><li><b>Habilitación:</b> de tipo (modelo de aeronave + función) y de clase (con aeronaves asociadas), cada una con su propio vencimiento.</li><li><b>CertificadoMedico:</b> clase RAV 67 (1, 2 o 3), número, fechas y restricciones. Nada clínico.</li><li><b>Bloqueo:</b> tipo (administrativo, médico, regulatorio), motivo, estado activo/resuelto, nota de resolución.</li><li><b>Usuario:</b> correo, rol, área, hash de contraseña. <b>Auditoría:</b> actor, acción, entidad, cambios, fecha.</li><li><b>Alerta</b> y <b>ParámetroSistema</b>, más 10 catálogos administrables.</li></ul>`, why:'La regla de oro: ninguna credencial existe sin titular (BR-10). Las claves foráneas con RESTRICT lo garantizan en la base de datos, no solo en el código.', src:'docs/sryg-definitions-and-tasks.md §5, packages/db/src/schema' },
    { t:'Categorías RAV 60 y clases RAV 67', b:`<p><b>RAV 60 (6 categorías):</b> piloto de transporte de línea aérea, piloto comercial, piloto privado, tripulante de cabina, técnico de mantenimiento, controlador de tránsito aéreo.</p><p><b>RAV 67 (3 clases):</b> Clase 1 para pilotos de línea y comerciales, Clase 2 para piloto privado, Clase 3 para controladores de tránsito aéreo.</p><p>En el código son tuplas <code>as const</code> en <code>packages/types</code> que generan a la vez los enums de PostgreSQL y los esquemas zod.</p>`, why:'Un solo origen para el enum evita que la base y la API discrepen. Cada tipo de licencia del catálogo declara su categoría RAV 60 y la clase médica que exige (D13).', src:'packages/types/src/enums.ts' },
    { t:'Los cuatro estados y cómo se derivan', b:`<p>El estado de una credencial <b>nunca se almacena</b>; se calcula al leer con <code>deriveCredentialStatus(vencimiento, hoy, umbral, tieneBloqueoActivo)</code>, en este orden:</p><ol style="margin:0;padding-left:18px"><li>Bloqueo activo del titular → <b>Bloqueada</b> (siempre gana).</li><li>Sin fecha de vencimiento (tipo que no vence, D20) → <b>Vigente</b>.</li><li>Hoy es posterior al vencimiento → <b>Vencida</b> (desde el día siguiente).</li><li>Días restantes ≤ umbral configurado → <b>Próxima a vencer</b>; si no, Vigente.</li></ol>`, why:'Si el estado se guardara, habría que recalcularlo cada noche y podría quedar desactualizado. Derivarlo garantiza que lo que ve el inspector a las 3 pm es verdad a las 3 pm. La tesis nombra los estados de forma inconsistente (bloqueada/suspendida); se eligió "Bloqueada" como nombre canónico (OD-07) y vive detrás de un único token en la UI.', src:'packages/types/src/credential-status.ts' },
    { t:'BR-07: el bloqueo que impide emitir', b:`<p>Al registrar o renovar cualquier credencial, el sistema verifica si el titular tiene un impedimento registrado. Si lo hay, dispara una alerta de bloqueo e impide la emisión hasta que la autoridad competente lo resuelva <b>formalmente</b>, con nota obligatoria (BR-08).</p><ul><li>Tipos: administrativo, médico, regulatorio.</li><li>Estados: activo → resuelto. Los bloqueos nunca se borran.</li><li>Quién resuelve: Administrador y Supervisor (OD-08, propuesta pendiente de INAC).</li><li>Dónde se aplica: emisión y renovación de licencia, alta y renovación de habilitación, registro y renovación de certificado médico, impresión de credencial.</li></ul>`, why:'Es el mecanismo definitorio de SRYG: "en ningún momento se pueda emitir una credencial a personal que no cumpla con todos los requisitos normativos".', src:'thesis.docx alcance; apps/api/src/licenses/services/license-rules.ts' },
    { t:'BR-09 / D13: coherencia licencia ↔ certificado médico', b:`<p>Si el tipo de licencia exige una clase médica (por ejemplo, Clase 1 para piloto comercial), la persona debe tener un certificado médico <b>de exactamente esa clase</b> con vencimiento mayor o igual a hoy. Si no, la emisión se rechaza con 409 y un motivo legible.</p><p>La exigencia por tipo de licencia es una <b>suposición del seed</b> a validar con INAC; por eso es un dato del catálogo, editable, y no una constante.</p>`, why:'La tesis pide "validar coherencia entre licencia, habilitaciones y certificado médico". Esta regla es su implementación concreta y se muestra antes de confirmar el trámite.', src:'docs/plan-ejecucion-paralela.md D13' },
    { t:'BR-02: números que no se inventan', b:`<p>La tesis no fija vigencias ni umbral de alerta. Por eso son <b>parámetros configurables</b> marcados "PENDIENTE INAC" hasta que la institución los confirme:</p><div class="tbl"><table><tr><th>Parámetro</th><th>Valor provisional</th><th>Dónde se edita</th></tr><tr><td>Umbral de alerta (días)</td><td>30</td><td>Parámetros → Alertas</td></tr><tr><td>Vigencia certificado médico clases 1, 2 y 3 (meses)</td><td>12</td><td>Parámetros → Vigencias</td></tr><tr><td>Vigencia por tipo de licencia (meses)</td><td>12 por tipo</td><td>Catálogo de tipos de licencia</td></tr></table></div>`, why:'Si el jurado pregunta "¿cuánto dura una licencia de piloto privado?", la respuesta honesta y correcta es: "lo que diga la RAV 60 o INAC; el sistema lo lee de configuración y hoy está marcado como pendiente". Nunca hay un número regulatorio quemado en el código.', src:'docs/sryg-definitions-and-tasks.md BR-02, OD-05, OD-06' },
    { t:'BR-11: toda mutación deja auditoría', b:`<p>Cada crear, actualizar, eliminar, emitir, renovar, bloquear, resolver, reconocer, exportar, restablecer contraseña y adjuntar escribe una fila en <code>auditoria</code> con actor, acción, entidad, id y cambios (antes/después). Se escribe <b>en la misma transacción</b> que la operación: si la auditoría falla, la operación se revierte.</p><p>La tabla es append-only por un trigger de PostgreSQL. Nunca guarda contraseñas, hashes ni bytes de imágenes.</p>`, why:'NFR-04 pide un registro inmutable e indexado alineado a ISO/IEC 27001. Hacerlo en la base de datos y no solo en la aplicación significa que ni un bug ni un administrador pueden borrar el rastro.', src:'packages/db/migrations/0001_audit_immutable.sql' },
    { t:'Matriz de permisos (D1, D24)', b:`<div class="tbl"><table><tr><th>Módulo</th><th>Administrador</th><th>Supervisor</th><th>Consulta</th></tr><tr><td>Personal</td><td>leer, escribir</td><td>leer, escribir</td><td>leer</td></tr><tr><td>Licencias (área licencias)</td><td>leer, escribir</td><td>leer; escribir solo si su área</td><td>leer</td></tr><tr><td>Cert. médicos (área medicina)</td><td>leer, escribir</td><td>leer; escribir solo si su área</td><td>leer</td></tr><tr><td>Bloqueos</td><td>leer, escribir</td><td>leer, escribir</td><td>leer</td></tr><tr><td>Alertas</td><td>leer</td><td>leer</td><td>leer</td></tr><tr><td>Reportes</td><td>leer, exportar</td><td>leer, exportar</td><td>leer (solo vencimientos)</td></tr><tr><td>Auditoría</td><td>leer</td><td>leer</td><td>—</td></tr><tr><td>Usuarios, parámetros</td><td>leer, escribir</td><td>—</td><td>—</td></tr><tr><td>Catálogos</td><td>leer, escribir</td><td>leer</td><td>leer</td></tr><tr><td>Credenciales (PDF)</td><td>exportar</td><td>exportar</td><td>—</td></tr></table></div><p>Cada usuario tiene rol <b>y</b> área (licencias, medicina o ambas). La matriz vive como datos en <code>packages/types/src/permissions.ts</code> y la usan tanto la API (guard) como la web (navegación y rutas).</p>`, why:'La tesis nombra los tres perfiles pero no define permisos por módulo; la matriz es una propuesta documentada, pendiente de validar con INAC (OD-14). El área por usuario (D24) resuelve que un supervisor de medicina no emita licencias.', src:'docs/sryg-definitions-and-tasks.md §4' },
    { t:'Decisiones abiertas y decisiones tomadas', b:`<p><b>Abiertas (necesitan a INAC):</b> OD-05 umbral de alerta, OD-06 vigencias, OD-07 nombre del estado bloqueado, OD-08 quién levanta un bloqueo, OD-12 política de contraseñas, OD-14 matriz de permisos.</p><p><b>Tomadas y registradas (D1 a D25, 13/10/2026):</b> matriz de permisos (D1), parámetros editables con placeholder (D3), sin refresh token (D4), fotos en BD ≤ 200 KB (D5), QR con token opaco (D9), respaldos con GitHub Actions y age (D11), coherencia RAV 67 (D13), contraseña temporal mostrada una vez (D14), estado derivado (D17), catálogos (D19), tipos que no vencen (D20), número = cédula por defecto (D22), registro de intentos de acceso (D23), rol + área (D24), solo datos ficticios (D25).</p>`, why:'Mostrar un registro de decisiones con dueño y fecha es la mejor respuesta a "¿y eso quién lo decidió?". No se resolvió nada por suposición silenciosa.', src:'docs/sryg-definitions-and-tasks.md §10, docs/plan-ejecucion-paralela.md §1' },
  ],
  jury:[
    { k:'T', q:'¿Cómo se calcula el estado de una credencial y por qué no se guarda en la tabla?', a:`<p>Se deriva al leer con una función pura compartida entre API y web: bloqueo activo gana; sin vencimiento es vigente; vencida desde el día siguiente al vencimiento; próxima a vencer cuando los días restantes son menores o iguales al umbral configurado. No se guarda porque depende de "hoy" y del umbral: almacenarlo obligaría a un proceso nocturno y abriría ventanas de inconsistencia. La columna <code>status</code> que queda en la tabla es un residuo del esquema inicial y no se usa para esa decisión (D17).</p>` },
    { k:'T', q:'Explica BR-07 de punta a punta: desde que alguien intenta emitir hasta que se rechaza.', a:`<p>El usuario abre "Emitir o renovar" en el expediente. La web llama <code>GET /api/licenses/check</code> y, si hay bloqueo, la página entera entra en estado "Bloqueo activo · Emisión impedida" sin formulario. Si no hay bloqueo y confirma, <code>POST /api/licenses</code> abre una transacción, ejecuta <code>assertNotBlocked</code> (consulta <code>bloqueo</code> con estado activo e índice parcial), luego la coherencia médica, y solo entonces inserta la licencia y la fila de auditoría. Si alguien registró un bloqueo entre el check y el envío, el POST responde 409 y la web vuelve al mismo estado bloqueado. Nada se escribe.</p>` },
    { k:'P', q:'¿Qué pasa cuando INAC entregue las vigencias reales?', a:`<p>Un administrador las carga en la página de Parámetros (certificados médicos) o en el catálogo de tipos de licencia (vigencia por tipo). Al guardar, el indicador "PENDIENTE INAC" desaparece porque la bandera <code>is_placeholder</code> pasa a falso, queda una fila de auditoría con el valor anterior y el nuevo, y las próximas emisiones calculan el vencimiento con el valor real. No hay que tocar código ni desplegar.</p>` },
    { k:'T', q:'¿Quién puede levantar un bloqueo y cómo se garantiza que no lo levanten dos personas a la vez?', a:`<p>Administrador y Supervisor (cualquier área), con nota de resolución obligatoria. La actualización corre con <code>WHERE id = ? AND status = 'activo'</code>: la primera resolución gana y la segunda recibe 409 "ya resuelto". Todo dentro de una transacción junto con la fila de auditoría "resolver".</p>` },
    { k:'P', q:'¿Por qué hay decisiones "pendientes de INAC" en una tesis terminada?', a:`<p>Porque la fuente de esos números es la regulación o la institución, no el tesista. Inventar un umbral o una vigencia sería falsear una regla de seguridad operacional. El sistema está completo: los parámetros existen, se editan, se auditan y están señalados como provisionales. Es una práctica de ingeniería responsable y está documentada como decisiones abiertas con dueño.</p>` },
  ],
  quiz:[
    { q:'¿Qué estado gana siempre al derivar el estatus de una credencial?', o:['Vencida','Próxima a vencer','Bloqueada','Vigente'], a:2, e:'Un bloqueo activo del titular se evalúa primero y gana sobre cualquier fecha.' },
    { q:'¿Dónde se guarda el umbral de alerta de vencimiento?', o:['Como constante en el código','En la tabla parametro_sistema','En una variable de entorno','En el token JWT'], a:1, e:'En parametro_sistema con la clave alerts.threshold_days y una bandera de placeholder.' },
    { q:'¿Qué exige la regla de coherencia D13?', o:['Que la licencia tenga foto','Un certificado médico vigente de la clase que exige el tipo de licencia','Que el supervisor firme','Que el bloqueo esté resuelto hace 30 días'], a:1, e:'Si el tipo de licencia exige una clase RAV 67, debe existir un certificado de esa clase con vencimiento ≥ hoy.' },
    { q:'¿Qué ocurre con una credencial sin titular?', o:['Se crea como huérfana','Es imposible: las claves foráneas lo impiden (BR-10)','Se asigna al administrador','Se borra a medianoche'], a:1, e:'personal_id es NOT NULL con FK RESTRICT: ninguna credencial existe sin PersonalAeronautico.' },
    { q:'Un Supervisor con área "medicina" intenta emitir una licencia. ¿Resultado?', o:['200 OK','403 Prohibido','409 Conflicto','401 No autorizado'], a:1, e:'Los supervisores escriben solo en su área: licencias es del área licencias. can() devuelve falso y el guard responde 403.' },
    { q:'¿Qué campo es obligatorio al resolver un bloqueo?', o:['Un adjunto PDF','La nota de resolución','La firma del presidente','El número de licencia'], a:1, e:'BR-08: la resolución es formal y exige una nota; queda en la auditoría con la acción "resolver".' },
  ],
});
</script>
<script>
// ===== Zonas 3-4: arquitectura y backend =====
ZONES.push({
  id:'torre', name:'Torre de Control', icon:'🗼', tag:'Arquitectura y stack', walls:['#d7dde3','#aeb8c2'], roof:['#2f7d4e','#246b41'],
  intro:'Desde aquí se ve todo: el monorepo, las cuatro piezas, el flujo de una petición y por qué se eligió cada tecnología. Es la zona favorita del jurado técnico.',
  jokes:['El stack es TypeScript de punta a punta: un solo idioma, como pedir "una fría" en cualquier parte del país y que te entiendan.','NestJS, React, Drizzle, PostgreSQL: suena a alineación de la Vinotinto, pero es la arquitectura.'],
  cards:[
    { t:'El monorepo en cuatro piezas', b:`<pre>apps/web/        React 19 + Vite + TypeScript   (la interfaz)
apps/api/        NestJS 11 + TypeScript          (la lógica y la API REST)
packages/db/     Drizzle ORM + migraciones       (esquema PostgreSQL)
packages/types/  contratos zod, enums, permisos  (compartidos por web y api)</pre><p>Gestionado con <b>pnpm workspaces</b> (catálogo de versiones único), Node 24, TypeScript 6, ESLint 10, Prettier. Un solo <code>pnpm test</code> corre todo.</p>`, why:'Un monorepo permite que el contrato (zod) viva en un solo sitio y lo consuman 117 archivos de la web y 119 de la API. Si cambia un campo, falla el typecheck en ambos lados antes de llegar a producción.', src:'package.json, pnpm-workspace.yaml' },
    { t:'Cliente-servidor como lo pide la tesis', b:`<p>La tesis define una <b>arquitectura cliente-servidor en entorno web</b>: el cliente (SPA React) consume una API REST JSON sin estado; el servidor (NestJS) aplica las reglas y habla con PostgreSQL. La autenticación es un <b>JWT sin estado que lleva el rol</b> (NFR-05), así cualquier instancia del servidor puede atender cualquier petición.</p>`, why:'Cumple el eje temático "Aplicaciones Cliente-Servidor" y permite escalar el servidor sin sesiones pegajosas. También separa la UI (que cambia mucho) de las reglas (que cambian con la regulación).', src:'thesis.docx Cap. II; docs/sryg-definitions-and-tasks.md §8' },
    { t:'Por qué TypeScript y Node.js', b:`<ul><li>Tipado estático: errores de asignación se detectan al compilar, no en taquilla (argumento literal de la tesis).</li><li>Un solo lenguaje en cliente, servidor, esquema y contratos: menos traducción, menos bugs de frontera.</li><li>I/O asíncrona de Node: muchas consultas concurrentes con pocos recursos (9 usuarios y consultas de rampa).</li><li>Software libre y estándares abiertos: Ley de Infogobierno, art. 34 (NFR-07).</li></ul>`, src:'thesis.docx "Herramientas a aplicar"' },
    { t:'Por qué NestJS en el servidor', b:`<ul><li>Módulos por dominio (personnel, licenses, medical-certificates, validation-blocking, alerts, reports, audit, users, settings, catalogs, credentials, public-verify, auth, health).</li><li>Inyección de dependencias: los servicios reciben repositorios y un reloj inyectable, lo que facilita tests con fakes.</li><li>Guards y decoradores: <code>@RequirePermission('licenses','write')</code> declara el permiso al lado de la ruta.</li><li>Estructura convencional por módulo: <code>controllers/ services/ dtos/ repositories/</code>. El proyecto nació con arquitectura hexagonal y el 15/10/2026 se simplificó para que alguien sin esa formación lo lea sin curva de aprendizaje.</li></ul>`, why:'Si preguntan "¿por qué no Express a secas?": Nest impone orden (módulos, DI, guards) con el mismo Express debajo, y ese orden es lo que hace mantenible el sistema (ISO 25010, mantenibilidad).', src:'odd/tasks/simple-project-structure.md' },
    { t:'Por qué React + Vite en el cliente', b:`<ul><li>SPA con React 19 y React Router 8; Vite da arranque y recarga instantáneos y un build optimizado.</li><li><b>Sin librerías de estado</b> (ni Redux ni react-query): un hook propio <code>useApiResource</code> cubre carga, error y éxito. Menos dependencias, más control.</li><li>Dependencias mínimas: react, react-router, lucide-react (iconos), fuentes B612 y <code>@sryg/types</code>.</li><li>Tablet y teléfono de primera clase para los inspectores de rampa.</li></ul>`, src:'apps/web/package.json, apps/web/README.md' },
    { t:'Por qué PostgreSQL + Drizzle ORM', b:`<ul><li><b>PostgreSQL 17:</b> ACID y MVCC (lecturas sin bloquear escrituras), enums, CHECK constraints, índices parciales, triggers. La tesis lo exige explícitamente.</li><li><b>Drizzle:</b> SQL tipado en TypeScript; el esquema es código, las migraciones son archivos SQL versionados generados con drizzle-kit (OD-01 resuelto).</li><li>Las reglas duras (unicidad de cédula, fechas coherentes, bloqueo resuelto con nota, auditoría inmutable) viven <b>en la base</b>, no solo en la aplicación.</li></ul>`, why:'Un ORM pesado escondería el SQL; Drizzle lo mantiene visible y tipado. Y poner las restricciones en PostgreSQL protege los datos aunque mañana alguien escriba otro cliente.', src:'packages/db' },
    { t:'El viaje de una petición', b:`<pre>Navegador (React)
  └─ fetchJson agrega "Authorization: Bearer &lt;jwt&gt;"
       └─ NestJS  /api/...
            ├─ JwtAuthGuard      verifica HS256, pone user {id, email, role, area}
            ├─ PermissionGuard   can(role, area, módulo, acción) → 403 si no
            ├─ ZodValidationPipe valida body/params → 400 con detalles
            ├─ Controller → Service (reglas: bloqueo, coherencia, vencimiento)
            │     └─ TransactionRunner.run(): repositorios Drizzle + auditoría
            │           └─ PostgreSQL (constraints, trigger de auditoría)
            └─ DomainExceptionFilter: NotFound 404, Conflict 409, Forbidden 403</pre>`, why:'Poder narrar este viaje de memoria demuestra que entiendes el sistema como un todo. Practícalo en voz alta.', src:'apps/api/src/configure-app.ts, common/' },
    { t:'Calidad y seguridad como marcos', b:`<ul><li><b>ISO/IEC 25010:</b> adecuación funcional (reglas RAV), fiabilidad (transacciones, tests), mantenibilidad (estructura convencional, tipado, lint).</li><li><b>ISO/IEC 27001 (alineación):</b> RBAC, JWT firmado, auditoría inmutable, cifrado en tránsito y en respaldos, registro de intentos de acceso.</li><li><b>NFR medibles:</b> disponibilidad &gt; 99 % en red local, latencia de consultas &lt; 3 s, concurrencia multiusuario, respaldos automáticos.</li></ul>`, src:'docs/sryg-definitions-and-tasks.md §8' },
    { t:'El proyecto en números', b:`<div class="tbl"><table><tr><th>Métrica</th><th>Valor</th></tr><tr><td>Líneas de TypeScript (apps + packages)</td><td>≈ 42 800</td></tr><tr><td>Commits / PRs fusionados</td><td>106 / 20</td></tr><tr><td>Archivos de prueba</td><td>92 (api 39, web 33, types 16, db 4)</td></tr><tr><td>Casos de prueba aproximados</td><td>≈ 720 (api 266, web 229, resto en types y db)</td></tr><tr><td>Tablas / enums / migraciones</td><td>26 / 13 / 3</td></tr><tr><td>Rutas HTTP de la API</td><td>≈ 70</td></tr><tr><td>Páginas de la web</td><td>15 sobre 6 plantillas</td></tr></table></div>`, why:'Ten dos o tres números a mano; dan credibilidad. Y si te preguntan por cobertura, responde que hay pruebas unitarias e integración con PostgreSQL real en CI, sin umbral de cobertura exigido todavía.', src:'git log, find *.test.ts' },
  ],
  jury:[
    { k:'T', q:'Describe la arquitectura del sistema.', a:`<p>Cliente-servidor en web, en tres capas físicas: una SPA en React que corre en el navegador (escritorio, tablet o teléfono), una API REST en NestJS que concentra las reglas de negocio y la seguridad, y PostgreSQL como almacén transaccional. Las tres comparten contratos TypeScript (zod) desde un paquete común. La API es sin estado: la identidad viaja en un JWT firmado con el rol y el área del usuario. Toda mutación ocurre en una transacción que incluye su fila de auditoría.</p>`, tip:'Dibuja tres cajas y una flecha por cada salto. Nombra el guard de permisos y la transacción.' },
    { k:'T', q:'¿Por qué un monorepo y no dos repositorios?', a:`<p>Porque el contrato entre cliente y servidor es la parte más frágil de un sistema cliente-servidor. En un monorepo, <code>packages/types</code> define una sola vez los esquemas, enums y la matriz de permisos; la web y la API los importan y el typecheck y los tests corren juntos en cada push. Un cambio incompatible rompe el build antes de llegar a producción. Además, un solo pipeline de CI y un solo comando de pruebas simplifican el mantenimiento.</p>` },
    { k:'T', q:'¿Por qué cambiaste de arquitectura hexagonal a una estructura convencional?', a:`<p>La primera versión usaba puertos y adaptadores (hexagonal). Funcionaba, pero exigía que cualquier mantenedor conociera ese patrón. Como el sistema lo heredará personal del INAC o estudiantes, se reorganizó a módulos con <code>controllers/services/dtos/repositories</code>, que es la estructura que cualquier desarrollador de NestJS reconoce. Fue una reorganización pura: mismas rutas, mismos contratos y mismas pruebas (279 de la API y 240 de la web siguieron en verde). La mantenibilidad es un atributo de calidad de ISO 25010 y pesa más que la pureza del patrón.</p>` },
    { k:'P', q:'¿Es escalable? ¿Qué pasa si mañana lo usan 200 personas o varias sedes?', a:`<p>La API es sin estado, así que se pueden levantar varias instancias detrás de un balanceador sin cambios de código. PostgreSQL con MVCC atiende lecturas concurrentes sin bloquear escrituras, y las operaciones sensibles usan bloqueos de fila o condiciones atómicas. La paginación es del lado del servidor en todas las listas grandes. Para varias sedes bastaría añadir una dimensión "sede" al personal y a los usuarios; se registró como decisión abierta para no diseñarla sin requisitos reales.</p>` },
    { k:'T', q:'¿Qué dependencias externas tiene y qué riesgo implican?', a:`<p>Todas son software libre con versiones fijadas en el catálogo de pnpm y un lockfile: NestJS, React, Drizzle, pg, zod, argon2, pdfkit, qrcode, sharp. El riesgo de obsolescencia se mitiga con el lockfile y la suite de pruebas, que permite actualizar con confianza. No hay servicios de terceros pagos: el hosting (Render y Neon) se eligió para validar y es sustituible por un servidor local con docker compose.</p>` },
  ],
  quiz:[
    { q:'¿Qué paquete comparte los contratos entre web y API?', o:['apps/api','packages/db','packages/types','node_modules'], a:2, e:'packages/types contiene esquemas zod, enums, la matriz de permisos y deriveCredentialStatus.' },
    { q:'¿Qué guard corre primero en NestJS al recibir una petición autenticada?', o:['PermissionGuard','ThrottlerGuard','JwtAuthGuard','ZodValidationPipe'], a:2, e:'JwtAuthGuard verifica el token y pone request.user; luego PermissionGuard consulta la matriz.' },
    { q:'¿Por qué la API es "sin estado"?', o:['Porque no usa base de datos','Porque la identidad viaja en el JWT y no hay sesiones en servidor','Porque no tiene variables','Porque usa GraphQL'], a:1, e:'NFR-05: JWT con rol y área; cualquier instancia puede atender cualquier petición.' },
    { q:'¿Qué herramienta genera las migraciones SQL?', o:['Prisma','drizzle-kit','TypeORM CLI','Flyway'], a:1, e:'drizzle-kit generate produce archivos SQL versionados en packages/db/migrations.' },
    { q:'¿Qué ley venezolana respalda el uso de software libre en el proyecto?', o:['Ley de Aeronáutica Civil','Ley de Infogobierno, art. 34','Ley Orgánica del Trabajo','LOPA'], a:1, e:'NFR-07 cita la Ley de Infogobierno (art. 34): software libre y estándares abiertos.' },
  ],
});

ZONES.push({
  id:'hangar', name:'El Hangar', icon:'🛠️', tag:'Backend: NestJS, seguridad y reglas', walls:['#c9ccd1','#9ea3aa'], roof:['#e2a93b','#c48f2a'],
  intro:'Donde se arman las piezas pesadas: autenticación, permisos, transacciones, bloqueos, alertas, reportes y la credencial en PDF. Aquí el jurado técnico afina la puntería.',
  jokes:['Argon2id para las contraseñas: ni el primo hacker de tu vecino la saca. Y si la saca, el throttling lo frena a los cinco intentos.','El cron de alertas corre a medianoche, pero como el hosting gratis duerme, también recalcula al leer. Como el venezolano: si no suena el despertador, igual se levanta.'],
  cards:[
    { t:'Arranque y configuración', b:`<ul><li><code>main.ts</code> crea la app y la pasa por <code>configureApp</code> (compartido con los tests de integración).</li><li>Prefijo global <code>/api</code>; <code>/health</code> (vivo, sin BD) y <code>/health/ready</code> (hace <code>select 1</code>; 503 si la BD no responde) quedan fuera.</li><li>CORS con lista exacta de orígenes, métodos GET/POST/PUT/PATCH/DELETE, cabecera <code>Retry-After</code> expuesta, sin cookies.</li><li><code>trust proxy</code> para leer la IP real detrás de Render (throttling por IP).</li><li>Variables validadas con <b>Joi</b> al arrancar: <code>JWT_SECRET</code> de al menos 32 bytes, <code>CORS_ORIGIN</code> https en producción, URL de PostgreSQL obligatoria. Un error lista todas las variables malas de una vez.</li></ul>`, why:'Validar el entorno al arrancar convierte un despliegue mal configurado en un fallo inmediato y legible, no en un bug silencioso a las 2 am.', src:'apps/api/src/configure-app.ts, common/config/env.schema.ts' },
    { t:'Autenticación: login, JWT y contraseñas', b:`<ul><li>Contraseñas con <b>argon2id</b> (ganador del Password Hashing Competition).</li><li>Para un correo inexistente se verifica igual un hash falso: el tiempo de respuesta no revela si la cuenta existe.</li><li>Un único 401 para correo desconocido, clave incorrecta o usuario inactivo.</li><li>Throttling: 5 intentos por minuto por IP (configurable); el 429 lleva <code>Retry-After</code>.</li><li>JWT HS256 con <code>{sub, email, role, area}</code>, TTL 3600 s. <b>Sin refresh token</b> (D4): la sesión muere con la pestaña.</li><li>Cada intento queda en <code>acceso_usuario</code> (D23) y en auditoría con acción "autenticar".</li><li>Cambio de contraseña: mínimo 10 caracteres; clave actual incorrecta responde <b>403</b> (no 401) para no cerrar la sesión.</li></ul>`, why:'NFR-08 (Ley Especial contra Delitos Informáticos) pide control de acceso, autenticación y registro. Cada punto de esta tarjeta responde a una amenaza concreta: fuerza bruta, enumeración de usuarios, robo de hash.', src:'apps/api/src/auth/services/login.service.ts' },
    { t:'Autorización: la matriz como guard', b:`<pre>@RequirePermission('licenses', 'write')
@Post('licenses') issue(...) { ... }

// PermissionGuard
if (!user || !can(user.role, user.area, required.module, required.action)) throw forbidden()

// packages/types/src/permissions.ts
export function can(role, area, module, action) {
  const entry = PERMISSION_MATRIX[module]
  if (!entry.grants[role].includes(action)) return false
  if (action === 'read' || entry.area === null || !AREA_SCOPED_ROLES.includes(role)) return true
  return area === 'ambas' || area === entry.area
}</pre><p>Algunas reglas finas viven en los servicios: Consulta solo ve el reporte de vencimientos y no exporta; el PDF de credencial exige además permiso de escritura en licencias o medicina.</p>`, why:'La misma función decide en la API (seguridad real) y en la web (qué botones y menús mostrar). No hay dos verdades.', src:'apps/api/src/common/guards/permission.guard.ts' },
    { t:'Transacciones: operación + auditoría, juntas o ninguna', b:`<pre>// TransactionRunner.run(work)
return this.db.transaction((tx) => work(createRepos(tx)))

// Dentro de IssueLicenseService
await assertNotBlocked(repos, person.id)            // BR-07 → 409
const problem = await medicalCoherenceProblem(...)  // D13 → 409
const license = await repos.licenses.insert(...)
await repos.audit.record({ actorId, action: 'emitir', entity: 'licencia', ... })</pre><p>Hay un test que fuerza el fallo de la auditoría y comprueba que el bloqueo se revierte.</p>`, why:'NFR-09 pide ACID en emisión y renovación; BR-11 pide auditoría en cada mutación. Hacerlas en la misma transacción es la única forma de que ambas se cumplan a la vez.', src:'apps/api/src/common/database/transaction-runner.ts' },
    { t:'Vencimiento calculado en el servidor', b:`<ul><li>La web <b>nunca envía</b> la fecha de vencimiento: la API la calcula con <code>addMonths(emisión, vigencia)</code>, ajustando al último día del mes (31 de enero + 1 mes = 28/29 de febrero).</li><li>Si el tipo de licencia no vence (D20) la fecha es nula y la credencial es vigente para siempre.</li><li>Si el tipo vence pero no tiene meses configurados, la API responde 409: nadie emite con una vigencia inventada.</li><li>Los certificados médicos usan los meses de <code>parametro_sistema</code> por clase.</li></ul>`, why:'Si el cliente calculara la fecha, un error de reloj o un usuario curioso podrían emitir con vencimientos falsos. La regla vive en un solo sitio: el servidor.', src:'apps/api/src/licenses/services/license.ts' },
    { t:'Concurrencia: nueve manos, cero pisadas', b:`<ul><li><code>SELECT ... FOR UPDATE</code> al cargar una licencia para renovarla o tocar sus habilitaciones.</li><li>Último administrador activo: lectura con bloqueo de fila; es 409 desactivar o degradar al último.</li><li>Resolver bloqueo y reconocer alerta: <code>UPDATE ... WHERE status='activo'</code> / <code>WHERE acknowledged_at IS NULL</code>; el segundo recibe 409.</li><li>Recalcular alertas: <code>pg_advisory_xact_lock</code> para que dos instancias no sincronicen a la vez.</li><li>Lecturas sin bloqueos gracias a MVCC.</li></ul>`, why:'NFR-03 habla de usuarios concurrentes apoyándose en MVCC. Estas técnicas son la respuesta concreta a "¿qué pasa si dos supervisores resuelven el mismo bloqueo?".', src:'apps/api/src/*/repositories' },
    { t:'Alertas: cron + recálculo al leer', b:`<ul><li>Tabla <code>alerta</code> persistida: tipo (vencida/próxima), credencial, fecha, reconocimiento.</li><li>Job diario a medianoche (<code>@Cron</code> de @nestjs/schedule) que recalcula; errores se registran, nunca tumban el proceso.</li><li>También se recalcula <b>al abrir el panel</b>: el hosting gratuito duerme y puede perder el cron.</li><li>Sincronización idempotente: inserta las que faltan, borra las que sobran, actualiza fechas y limpia el reconocimiento si la fecha cambió.</li><li>Umbral desde <code>parametro_sistema</code>. Licencias sin vencimiento no generan alertas. Canal: en la aplicación (OD-04; correo como mejora futura).</li></ul>`, src:'apps/api/src/alerts/services' },
    { t:'Reportes y exportación', b:`<ul><li>Tres reportes (OD-10): <b>vencimientos</b> (vencidas y próximas), <b>estado consolidado</b> por persona (peor estado o "sin credenciales") y <b>bloqueos activos</b>.</li><li>Filtros por texto, tipo de licencia, categoría RAV 60, estado y rango de fechas; paginación.</li><li>Exportación CSV y PDF (pdfkit, A4 apaisado con cabecera repetida, fecha de referencia, umbral y "PENDIENTE INAC" cuando aplica).</li><li>Cada exportación escribe auditoría "exportar" con filtros y número de filas.</li><li>CSV protegido contra inyección de fórmulas (celdas que empiezan por = + - @ se prefijan).</li></ul>`, src:'apps/api/src/reports' },
    { t:'La credencial impresa (PDF CR80 + QR)', b:`<ul><li>Formato de tarjeta CR80 (85,6 × 54 mm), anverso y reverso, medido sobre las tarjetas reales del INAC.</li><li>QR que apunta a <code>/verificar/&lt;token&gt;</code>: página pública que muestra solo tipo, número, estado y vencimiento (D9), con throttling.</li><li>Recursos gráficos (logo INAC, firma del presidente) cargados por el administrador y guardados en BD; escudo y emblema OACI como activos fijos.</li><li>Se rechaza (409) si el titular tiene bloqueo activo o la credencial está vencida.</li><li>Cada emisión de PDF deja auditoría "emitir" con salida <code>credencial_pdf</code>.</li></ul>`, why:'Responde a OD-09: PDF primero (el componente GeneradorCredencialPDF que nombra la tesis) con QR como verificación. La tarjeta médica no lleva ningún dato clínico.', src:'apps/api/src/credentials' },
    { t:'Archivos, fotos y validación de entrada', b:`<ul><li>Validación por ruta con <b>zod</b> (<code>ZodValidationPipe</code>): un 400 devuelve la ruta y el mensaje de cada campo inválido; esquemas <code>.strict()</code> rechazan campos desconocidos.</li><li>Fotos y firmas: hasta 5 MB de subida, comprimidas con sharp a ≤ 200 KB (JPEG 600×800 para foto, PNG para firma) y guardadas como bytea.</li><li>Adjuntos PDF/JPEG/PNG hasta 5 MB; el tipo se detecta por <b>magic bytes</b>, no por la extensión. Errores 413 (tamaño) y 415 (tipo).</li><li>Postgres 23505 (duplicado) → 409; 23503 (FK) → 404 o 409 según el contexto.</li></ul>`, src:'apps/api/src/personnel/services' },
    { t:'Pruebas del backend', b:`<ul><li>39 archivos: 25 de integración (<code>*.int.test.ts</code>) y 14 unitarios.</li><li>Integración = <b>PostgreSQL real</b> (docker o el servicio de CI) + la AppModule completa + supertest sobre HTTP real.</li><li>Unitarios con fakes en memoria y un reloj inyectable.</li><li>Ejemplos: "responde 409 mientras la persona tiene un bloqueo activo (BR-07) y no escribe nada", "revierte el bloqueo cuando falla la escritura de auditoría", "responde 403 cuando un supervisor de licencias escribe un certificado médico", "la BD caída devuelve 503 en /health/ready", snapshot del PDF de credencial leído con pdf-parse.</li><li>Dos pruebas de integración fallan de forma conocida en local (una exportación sin ORDER BY y un placeholder contra datos locales); están documentadas y son previas al refactor.</li></ul>`, why:'Las pruebas de integración contra PostgreSQL real prueban constraints y triggers, no un mock. Es lo que permite afirmar que BR-07 y BR-11 se cumplen, no solo que "está programado".', src:'apps/api/src/**/*.test.ts' },
  ],
  jury:[
    { k:'T', q:'¿Cómo manejas la autenticación y qué pasa cuando expira el token?', a:`<p>Login con correo y contraseña; la API verifica el hash argon2id, registra el intento y emite un JWT HS256 de una hora con sub, email, rol y área. No hay refresh token por decisión (D4): el riesgo de un token de larga vida no se justifica en una oficina donde la sesión muere al cerrar la pestaña. Cuando expira, cualquier petición responde 401; la web limpia la sesión y redirige a /ingreso con el destino en <code>next</code>, saneado para evitar redirecciones abiertas.</p>` },
    { k:'T', q:'¿Dónde se aplican los permisos: en el frontend o en el backend?', a:`<p>En los dos, con la misma función <code>can()</code>. En el backend es seguridad: un guard global lee el decorador de cada ruta y responde 403. En el frontend es experiencia: oculta menús y botones y muestra la página 403 sin hacer la petición. Si alguien salta la UI, la API lo detiene igual; hay pruebas de integración que lo verifican por rol y por área.</p>` },
    { k:'T', q:'¿Cómo garantizas que la auditoría no se pueda alterar?', a:`<p>Tres capas: (1) la fila se escribe en la misma transacción que la operación, así no puede existir una operación sin su rastro; (2) un trigger de PostgreSQL rechaza UPDATE y DELETE sobre la tabla, por lo que ni la aplicación ni un administrador con acceso a la API pueden modificarla; (3) la auditoría nunca guarda contraseñas ni bytes de archivos, solo metadatos y los cambios antes/después. La clave foránea del actor es RESTRICT: no se puede borrar un usuario con rastro.</p>` },
    { k:'T', q:'¿Qué ocurre si dos usuarios renuevan la misma licencia al mismo tiempo?', a:`<p>La renovación carga la licencia con <code>SELECT ... FOR UPDATE</code> dentro de la transacción. La segunda transacción espera a que termine la primera y entonces ve el estado ya renovado, con lo que sus validaciones corren sobre datos actuales. No hay pérdida de actualizaciones ni dos filas de auditoría contradictorias.</p>` },
    { k:'P', q:'¿Cómo se entera un supervisor de que una licencia está por vencer?', a:`<p>Abre el panel: el sistema recalcula las alertas con el umbral configurado y muestra un resumen por tipo (vencidas, próximas), por área y por clase de credencial, con filtros. Puede reconocer cada alerta, lo que queda auditado; si otra persona la reconoció antes recibe un aviso. Hoy el canal es la propia aplicación; el correo quedó como mejora futura porque INAC aún no define el canal (OD-04).</p>` },
    { k:'T', q:'¿Por qué validas con zod y no con class-validator, que es lo habitual en NestJS?', a:`<p>Porque los mismos esquemas zod se usan en el cliente para tipar y validar respuestas y formularios. Con class-validator tendría que duplicar las reglas en dos sintaxis. Un pipe pequeño adapta zod a NestJS y devuelve errores 400 con la ruta de cada campo. Además los esquemas estrictos rechazan campos desconocidos, lo que protege la regla "sin datos clínicos".</p>` },
  ],
  quiz:[
    { q:'¿Con qué algoritmo se guardan las contraseñas?', o:['MD5','bcrypt','argon2id','SHA-256 con sal'], a:2, e:'@node-rs/argon2 con sus valores por defecto, que corresponden a argon2id.' },
    { q:'¿Qué responde la API si el titular tiene un bloqueo activo al emitir?', o:['200 con advertencia','409 Conflicto y no escribe nada','403 Prohibido','422 Unprocessable'], a:1, e:'assertNotBlocked lanza ConflictError → 409, dentro de la transacción y antes de cualquier escritura.' },
    { q:'¿Quién calcula la fecha de vencimiento de una licencia?', o:['El navegador','El servidor con la vigencia del tipo','El usuario la escribe','PostgreSQL con un trigger'], a:1, e:'La web nunca la envía; la API usa addMonths con ajuste al fin de mes, o null si el tipo no vence.' },
    { q:'¿Por qué las alertas también se recalculan al abrir el panel?', o:['Por estética','Porque el hosting gratuito duerme y puede perder el cron','Porque no existe cron','Porque el panel es público'], a:1, e:'Hay cron a medianoche y, como respaldo, recálculo idempotente al leer.' },
    { q:'¿Qué contiene el QR de la credencial impresa?', o:['Los datos del titular cifrados','Una URL pública de verificación con un token opaco','El hash de la contraseña','El diagnóstico médico'], a:1, e:'D9: /verificar/<token>; la página pública solo muestra tipo, número, estado y vencimiento.' },
    { q:'Cambio de contraseña con la clave actual incorrecta responde...', o:['401','403','409','400'], a:1, e:'403 a propósito: un 401 haría que la web cerrara la sesión.' },
  ],
});
</script>
<script>
// ===== Zonas 5-6: frontend y datos =====
ZONES.push({
  id:'pista', name:'La Pista', icon:'🛫', tag:'Frontend: React, rutas y diseño', walls:['#f6e7c8','#dcc9a0'], roof:['#04528a','#033e68'],
  intro:'La interfaz que ven los nueve funcionarios: cómo se protegen las rutas, cómo se compone el expediente, por qué el diseño parece un panel de cabina y cómo se prueba.',
  jokes:['El diseño se inspira en el ECAM de un Airbus: solo hay color cuando hay un problema. Como la luz del "check engine", pero sin sustos.','La fuente es B612, diseñada para cabinas de avión. O sea, el jurado va a leer tu UI con tipografía aeronáutica certificada.'],
  cards:[
    { t:'Estructura: pages/ y common/', b:`<pre>src/
  main.tsx, App.tsx, AppRoutes.tsx   arranque y enrutado
  routes.ts                          TODAS las rutas; las páginas enlazan solo por aquí
  expediente-registry.ts             compone las pestañas y acciones del expediente
  pages/&lt;página&gt;/                   PageX.tsx + components/ hooks/ services/ utils/
  common/                            lo que usa más de una página
    components/  hooks/  services/  styles/  utils/  types/
  test/                              helpers (renderApp, mockApi)</pre><p>Regla ESLint: <b>una página nunca importa otra página</b>, y <code>common/</code> nunca importa <code>pages/</code>.</p>`, why:'Las reglas de importación impiden el "espagueti": cada página es un módulo cerrado, y lo compartido sube a common. Permitió trabajar 11 ramas en paralelo sin conflictos.', src:'apps/web/eslint.config.js, README.md' },
    { t:'Tres capas de guardas en las rutas', b:`<ol style="margin:0;padding-left:18px"><li><b>RouteGate:</b> ¿hay token? Si no, redirige a <code>/ingreso?next=...</code>; si lo hay y vas al login, te manda al panel.</li><li><b>SessionGate:</b> llama a <code>/api/auth/me</code>; si falla muestra reintento; si el usuario debe cambiar contraseña lo retiene en <code>/perfil</code>.</li><li><b>RequirePermission(module, action):</b> evalúa <code>can()</code> con rol y área; si no, renderiza la página 403 sin pedir datos.</li></ol><p>Rutas: /ingreso, /panel, /personal, /personal/nuevo, /personal/:id (expediente), /personal/:id/licencia, /personal/:id/certificado-medico, /licencias, /bloqueos, /reportes, /auditoria, /usuarios, /parametros, /catalogos, /perfil, /403 y la pública /verificar/:token.</p>`, src:'apps/web/src/AppRoutes.tsx' },
    { t:'Sesión y cliente HTTP', b:`<ul><li>El token vive en <b>sessionStorage</b> (muere con la pestaña), con respaldo en memoria si el almacenamiento falla. Nunca localStorage.</li><li><code>fetchJson</code> agrega <code>Authorization: Bearer</code>, parsea JSON y lanza <code>ApiError</code> con status, cuerpo y cabeceras.</li><li>Un 401 <b>con</b> token limpia la sesión (expiró); un 401 <b>sin</b> token es un login rechazado y no cierra nada.</li><li><code>safeNextPath</code> solo acepta rutas del mismo origen: bloquea <code>//</code> y redirecciones externas.</li><li>Login tipado: 401 → credenciales inválidas (mismo mensaje para correo o clave), 429 → cuenta regresiva con <code>Retry-After</code>, otros → "no se pudo conectar".</li><li>El rol <b>siempre</b> sale de <code>/api/auth/me</code>, nunca de la URL (el modo demo con <code>?rol=</code> se eliminó, D12).</li></ul>`, why:'sessionStorage frente a localStorage es una decisión de seguridad: en una taquilla compartida, cerrar la pestaña debe cerrar la sesión.', src:'apps/web/src/common/services/session.ts, fetch-json.ts' },
    { t:'Datos sin librerías: useApiResource', b:`<pre>const res = useApiResource(key, load)
// key: string que describe todo de lo que depende la petición (null = no cargar aún)
// res: {status:'loading'} | {status:'error', error, retry} | {status:'ready', data, retry}</pre><ul><li>Ignora respuestas de claves o intentos anteriores: una respuesta lenta nunca pisa una nueva.</li><li>Los contenedores traducen esos estados a la prop <code>status</code> de cada plantilla (loading, error, empty, ready, blocked).</li><li>Búsquedas con <code>useDebouncedValue</code> (300 ms); un contador global de versión hace que el banner, la pestaña y la lista de bloqueos se refresquen al registrar o resolver uno.</li></ul>`, why:'Para nueve usuarios y listas paginadas en servidor, una caché cliente como react-query añadía complejidad sin beneficio. Un hook de 60 líneas, probado, era suficiente.', src:'apps/web/src/common/hooks/useApiResource.ts' },
    { t:'El expediente se compone, no se importa', b:`<pre>// src/expediente-registry.ts (fuera de pages/, por eso puede importar de todas)
export const EXPEDIENTE_TABS = [
  { id:'datos',      label:'Datos',      Component: DatosTab },
  { id:'documentos', label:'Documentos', Component: DocumentosTab },
  { id:'licencias',  label:'Licencias',  Component: LicenciasTab },
  { id:'medico',     label:'Médico',     Component: MedicoTab },
  { id:'bloqueos',   label:'Bloqueos',   Component: BloqueosTab },
  { id:'historial',  label:'Historial',  permission:{module:'audit',action:'read'}, Component: HistorialTab },
]
