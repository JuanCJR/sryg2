export const EXPEDIENTE_ACTIONS = [LicensesActions, BlockingActions, PersonnelActions, CredentialsActions]</pre><p>La página de personal solo renderiza "ranuras"; cada acción decide con <code>can()</code> si se muestra. El banner de bloqueo activo aparece en todas las pestañas y para todos los roles.</p>`, why:'Inversión de dependencias: la página de personal no conoce a licencias ni a bloqueos. Cada rama de trabajo tocaba solo su carpeta.', src:'apps/web/src/expediente-registry.ts' },
    { t:'Emitir licencia: el bloqueo como estado de página', b:`<ul><li>Al abrir, carga en paralelo la persona, sus licencias y <code>GET /api/licenses/check</code>.</li><li>Si <code>blocked</code>: la plantilla entra en <code>status="blocked"</code>, título "Bloqueo activo · Emisión impedida", lista de motivos y un único botón "Volver al expediente". <b>No hay formulario</b>.</li><li>Mientras se edita, un segundo check proyecta el "nuevo vence" en el riel lateral (o "pendiente INAC" si la vigencia es placeholder) y muestra problemas de coherencia.</li><li>Si el envío responde 409, la página pasa al mismo estado bloqueado con "Trámite rechazado".</li><li>La fecha de vencimiento nunca se envía; la calcula la API.</li></ul>`, why:'Principio 2: un bloqueo es un estado, no un error. El usuario ve el impedimento antes de teclear nada, y la API sigue siendo la última palabra.', src:'apps/web/src/pages/licenses/components/EmisionLicenciaContainer.tsx' },
    { t:'Sistema de diseño: 6 plantillas, un panel de cabina', b:`<ul><li>Plantillas: List, Detail, Form, Dashboard, Auth y Error. Todas reciben <code>status</code> y mantienen el marco de la página en cada estado (nada "salta").</li><li>Norte visual: <b>ECAM/EICAS</b> (alertas de cabina): densidad, legibilidad y color solo como veredicto.</li><li><b>Regla del color:</b> rojo para Vencida y Bloqueada (esta con trama y candado), ámbar para Próxima a vencer, Activa es la lámpara más silenciosa. El azul INAC (#04528A) es el único acento de marca: botones primarios, foco, selección.</li><li>Tipografía <b>B612</b> (diseñada por Airbus para cabinas) y B612 Mono solo para cifras en columnas.</li><li>Plano y cuadrado: sin sombras, radios de 0 a 2 px, líneas finas. Controles de 36 px en escritorio y <b>44 px</b> en tablet o táctil.</li><li>Temas día, noche y sistema; la elección se guarda en el navegador y se aplica antes de que React arranque (sin parpadeo).</li></ul>`, why:'Credibilidad antes que simpatía: es un instrumento de seguridad aeronáutica del Estado. Y los inspectores de rampa lo usan bajo el sol en una tablet: por eso contraste alto y botones grandes.', src:'apps/web/DESIGN.md, src/common/styles/tokens.css' },
    { t:'Componentes que valen la pena nombrar', b:`<ul><li><b>StatusBadge + Lamp:</b> color + icono + texto, nunca color solo (WCAG 1.4.1).</li><li><b>FilterPanel / CheckboxFilter:</b> columna izquierda; en tablet se pliega tras "Filtros" con el conteo activo.</li><li><b>Pagination:</b> "Mostrando 26–50 de 312"; servidor para listas grandes, cliente (<code>useClientPagination</code>) para pestañas.</li><li><b>DateInput:</b> dd/mm/aaaa con calendario (lunes primero, "Hoy", "Limpiar"); sustituye al input nativo porque este sigue el idioma del navegador.</li><li><b>Combobox / CatalogSelect:</b> ARIA 1.2 con búsqueda en servidor.</li><li><b>ConfirmDialog:</b> <code>&lt;dialog&gt;</code> nativo con frase de consecuencia y texto a escribir para acciones graves.</li><li><b>Convención de columnas:</b> ID, Persona, Tipo, Detalle, Fechas, Estado, Acciones, siempre en ese orden.</li></ul>`, src:'apps/web/src/common/components, docs/ui-conventions.md' },
    { t:'Accesibilidad (WCAG 2.2 AA)', b:`<ul><li>Enlace "Saltar al contenido", navegación por teclado completa, foco visible de 2 px.</li><li>Pestañas con patrón ARIA tabs y <i>roving tabindex</i>; selector de tema como radiogroup.</li><li>Errores anunciados con <code>aria-live</code>; campos inválidos duplican el borde en vez de ponerse rojos (el rojo es para lámparas).</li><li>Estado nunca solo por color; contraste ≥ 4,5:1.</li><li><code>prefers-reduced-motion</code> respetado; una sola animación autorizada (el barrido de alerta a credencial).</li><li>Objetivos táctiles de 44 px en tablet y teléfono.</li></ul>`, src:'apps/web/DESIGN.md §accesibilidad' },
    { t:'Pruebas del frontend', b:`<ul><li>33 archivos, ≈ 229 casos con vitest, jsdom y Testing Library.</li><li><code>mockApi(handler)</code> sustituye <code>fetch</code> por un enrutador de respuestas ficticias; nada llega a la red.</li><li><code>renderApp(path)</code> monta proveedores y rutas en un MemoryRouter con un usuario de prueba por rol y área.</li><li>Ejemplos: "inicia sesión, carga /me con el token y vuelve a la página que pidió el login"; "muestra un bloqueo abierto como estado de página, sin formulario (BR-07)"; "ofrece a un supervisor solo las credenciales de su área (D24)"; "muestra un banner persistente en todas las pestañas mientras hay bloqueo, para todos los roles".</li><li>Pendiente conocido: no hay pruebas E2E con Playwright (estaba planificado).</li></ul>`, src:'apps/web/src/**/*.test.tsx' },
    { t:'Cosas que conviene saber antes de que te las pregunten', b:`<ul><li>El listado de personal no se muestra sin filtro: hay una pista de "escribe para buscar". La búsqueda corre en servidor.</li><li>Las fotos y firmas se cargan con el token (no son <code>&lt;img src&gt;</code> públicas).</li><li><code>DESIGN.md</code> describe una rampa gris sin color de marca; los tokens reales usan una rampa azul marino con el azul INAC. El documento quedó atrás de la implementación.</li><li><code>docs/deploy.md</code> habla de un modo "demo"; ese modo ya no existe.</li><li>La pila de advertencias del expediente está apagada a propósito (una pila vacía se leería como "sin alertas").</li></ul>`, why:'Reconocer una desactualización documental con naturalidad vale más que fingir que no existe. Ya está identificada y es trivial de corregir.', src:'informe de revisión del código' },
  ],
  jury:[
    { k:'T', q:'¿Cómo protege el frontend las rutas y qué pasa si alguien manipula el rol en el navegador?', a:`<p>Tres guardas: existencia de token, validación de sesión contra <code>/api/auth/me</code> y permiso por módulo con la matriz compartida. El rol nunca se lee de la URL ni del almacenamiento: viene de la respuesta de la API, que lo obtiene del JWT firmado. Si alguien edita el estado en el navegador solo cambiará lo que ve; cualquier petición real la decide el guard del servidor con el mismo <code>can()</code>.</p>` },
    { k:'P', q:'¿Por qué la interfaz es tan sobria? ¿No debería ser más amigable?', a:`<p>Porque es un instrumento de fiscalización, no una red social: la credibilidad va antes que la simpatía. La referencia es el sistema de alertas de una cabina: en condiciones normales todo está en gris y el color aparece solo cuando hay un veredicto (vencida, bloqueada, próxima). Eso hace que un inspector en rampa detecte un problema de un vistazo. La "amabilidad" está en otros sitios: mensajes que nombran el impedimento, calendario en español, botones grandes en tablet, modo noche.</p>` },
    { k:'T', q:'¿Cómo evitas que la lógica de una pantalla se duplique en otra?', a:`<p>Con reglas de importación verificadas por ESLint: las páginas no se importan entre sí y lo compartido vive en <code>common/</code>. Las seis plantillas de página concentran la estructura y los estados (cargando, error, vacío, bloqueado) una sola vez. Y el expediente se compone desde un registro central, así cada funcionalidad aporta su pestaña sin tocar la página de personal.</p>` },
    { k:'P', q:'¿Cómo lo usa un inspector en rampa, con sol y guantes?', a:`<p>Entra desde el teléfono o la tablet con su rol de consulta, busca por cédula o nombre y abre el expediente. Ve primero el banner de bloqueo si existe y las lámparas de estado con icono y texto, en alto contraste. Los controles miden 44 px, la navegación se pliega en un cajón y las tablas se convierten en filas apiladas. Si tiene la credencial física en la mano, puede escanear el QR y ver el estado en la página pública sin iniciar sesión.</p>` },
    { k:'T', q:'¿Cómo pruebas la interfaz sin un servidor?', a:`<p>Con vitest y jsdom: un <code>mockApi</code> intercepta <code>fetch</code> y responde con datos ficticios por ruta; <code>renderApp</code> monta la aplicación completa en memoria con un usuario del rol y área que necesite la prueba. Así se verifican flujos enteros: login y redirección, 403 por área, estado bloqueado en el formulario, banner persistente. Son 229 casos que corren en segundos en cada push.</p>` },
  ],
  quiz:[
    { q:'¿Dónde guarda la web el token de sesión?', o:['localStorage','Una cookie','sessionStorage','IndexedDB'], a:2, e:'sessionStorage, para que la sesión muera con la pestaña; con respaldo en memoria si falla.' },
    { q:'¿Qué hace la página de emisión si el check inicial indica bloqueo?', o:['Muestra el formulario con una advertencia','Reemplaza el formulario por el estado "Emisión impedida"','Redirige al login','Envía el formulario igual'], a:1, e:'El bloqueo es un estado de primer nivel de la plantilla: sin formulario, solo "Volver al expediente".' },
    { q:'¿Qué regla impone ESLint entre páginas?', o:['Máximo 100 líneas','Una página no importa otra página','Todo debe ser una clase','Prohibido usar hooks'], a:1, e:'Las páginas son módulos cerrados; lo compartido va a common/ y las rutas a routes.ts.' },
    { q:'¿Qué color se reserva para la marca INAC?', o:['Rojo','Ámbar','Azul #04528A','Verde'], a:2, e:'El azul INAC es el único acento de marca; rojo y ámbar son solo lámparas de estado.' },
    { q:'¿Por qué DateInput reemplaza al input de fecha nativo?', o:['Es más bonito','El nativo sigue el idioma del navegador y no garantiza dd/mm/aaaa','El nativo no funciona en React','Por accesibilidad únicamente'], a:1, e:'La taquilla escribe dd/mm/aaaa; el control propio lo garantiza y añade calendario con lunes primero.' },
    { q:'¿Qué muestra la página pública /verificar/:token?', o:['El expediente completo','Solo tipo, número, estado y vencimiento','La foto y la cédula','El historial médico'], a:1, e:'D9: mínima exposición de datos; además está limitada por throttling.' },
  ],
});

ZONES.push({
  id:'boveda', name:'La Bóveda', icon:'🗄️', tag:'Base de datos y contratos', walls:['#cfd6cf','#a3ada3'], roof:['#6b4e2e','#523b22'],
  intro:'26 tablas, 13 enums, 3 migraciones y una regla: las garantías importantes viven en PostgreSQL, no solo en el código.',
  jokes:['La bóveda tiene 26 tablas y un trigger que grita si alguien intenta borrar la auditoría. Literalmente: RAISE EXCEPTION.','Aquí los datos están más protegidos que la receta de la hallaca de la abuela: RESTRICT por todos lados.'],
  cards:[
    { t:'Mapa de las 26 tablas', b:`<div class="tbl"><table><tr><th>Grupo</th><th>Tablas</th></tr><tr><td>Usuarios y acceso</td><td>usuario, acceso_usuario</td></tr><tr><td>Catálogos (10)</td><td>catalog_license_type, catalog_type_rating, catalog_class_rating, catalog_aircraft, catalog_function, catalog_license_observation, catalog_medical_observation, catalog_document_type, catalog_attachment_type, catalog_nationality</td></tr><tr><td>Personal</td><td>personal_aeronautico, personal_adjunto</td></tr><tr><td>Credenciales</td><td>licencia, licencia_observacion, habilitacion_tipo, habilitacion_clase, habilitacion_clase_aeronave, certificado_medico, certificado_observacion</td></tr><tr><td>Control</td><td>bloqueo, alerta, auditoria</td></tr><tr><td>Configuración</td><td>parametro_sistema, recurso_grafico</td></tr></table></div><p>Claves primarias UUID generadas en la base; auditoría y accesos con identidad bigint.</p>`, src:'packages/db/src/schema/*.ts' },
    { t:'Las restricciones que cuentan una historia', b:`<ul><li><code>cedula ~ '^[0-9]{6,9}$'</code> y única; se normaliza (sin V-, puntos ni guiones) antes de guardar.</li><li><code>expiry_date &gt; issue_date</code> en licencias (o nula) y certificados.</li><li><b>bloqueo_resolution_consistency:</b> estado "resuelto" ⇔ <code>resolved_by</code> y <code>resolved_at</code> presentes.</li><li>Alerta reconocida ⇔ <code>acknowledged_by</code> y <code>acknowledged_at</code> presentes; única por (credencial, tipo).</li><li>Adjunto: <code>size = octet_length(data)</code> y entre 1 byte y 5 MB.</li><li>Foto y su MIME nulos o presentes juntos.</li><li>Unicidad insensible a mayúsculas: <code>lower(email)</code>, <code>lower(name_es)</code> en catálogos.</li><li>Índice <b>parcial</b> sobre bloqueos activos por persona: el check de BR-07 es instantáneo.</li></ul>`, why:'Cada CHECK es una regla de negocio que no depende de que el programador se acuerde. Si mañana otro sistema escribe en esta base, las reglas siguen.', src:'packages/db/src/schema/bloqueo.ts, personal.ts, alerta.ts' },
    { t:'Claves foráneas: RESTRICT por defecto', b:`<ul><li>Persona → licencias, certificados, bloqueos: <b>RESTRICT</b>. No se puede borrar una persona con credenciales (BR-10); la API responde 409.</li><li>Catálogos en uso: RESTRICT; se desactivan en vez de borrarse.</li><li>Adjuntos y alertas: <b>CASCADE</b> con la persona (son derivados, no credenciales).</li><li><code>alerta.credential_id</code> no tiene FK porque es polimórfico (licencia, habilitación o certificado según <code>credential_kind</code>).</li><li>Auditoría → usuario: RESTRICT. No se borra un usuario que dejó rastro; se desactiva.</li></ul>`, src:'packages/db/src/schema' },
    { t:'Auditoría inmutable, en SQL', b:`<pre>-- 0001_audit_immutable.sql
CREATE FUNCTION auditoria_reject_mutation() RETURNS trigger LANGUAGE plpgsql AS $$
BEGIN RAISE EXCEPTION 'auditoria is append-only: % is not allowed', TG_OP; END; $$;
CREATE TRIGGER auditoria_immutable BEFORE UPDATE OR DELETE ON "auditoria"
FOR EACH ROW EXECUTE FUNCTION auditoria_reject_mutation();</pre><p>Columnas: id, occurred_at, actor_id (nulo = anónimo o sistema), action (enum de 12 acciones), entity, entity_id, changes jsonb {before, after}, request_id. Índices por entidad, por actor y por fecha.</p><p>TRUNCATE no está cubierto a propósito (lo usan las pruebas); el rol de producción no debe tener ese privilegio.</p>`, why:'Pregunta clásica: "¿y si un administrador borra el rastro?". Respuesta: no puede, lo impide la base de datos (SQLSTATE P0001) y hay una prueba que lo demuestra.', src:'packages/db/migrations/0001_audit_immutable.sql' },
    { t:'Las tres migraciones', b:`<ul><li><b>0000_init:</b> 9 enums y 7 tablas iniciales (usuario, personal, licencia, habilitación, certificado, bloqueo, auditoría).</li><li><b>0001_audit_immutable:</b> el trigger de solo-anexar.</li><li><b>0002_foundation:</b> la "única migración del lote": 20 tablas nuevas (catálogos, adjuntos, observaciones, habilitaciones tipo/clase, parámetros, recursos, alertas, accesos), 4 enums, 8 acciones de auditoría, nuevas columnas en personal y licencia, baja de la tabla antigua <code>habilitacion</code>, y la carga de los 4 parámetros placeholder.</li></ul><p>Se aplican con <code>node packages/db/dist/migrate.js</code> usando la URL <b>directa</b> (no pooled) y quedan registradas en <code>drizzle.__drizzle_migrations</code>. En producción corren al arrancar la API (una sola instancia).</p>`, why:'Concentrar el esquema en una migración (0002) fue una decisión de la ola 0 del plan: evitar que 11 ramas paralelas generaran migraciones en conflicto.', src:'packages/db/migrations, docs/plan-ejecucion-paralela.md §3' },
    { t:'Parámetros, catálogos y recursos', b:`<ul><li><code>parametro_sistema</code>: clave texto, valor jsonb, <code>is_placeholder</code>, quién lo actualizó. Claves: <code>alerts.threshold_days</code>, <code>medical.validity_months.clase_1/2/3</code>.</li><li>Vigencia de licencias: por tipo, en <code>catalog_license_type</code> (<code>validity_months</code>, <code>validity_is_placeholder</code>, <code>applies_expiry</code>, <code>required_medical_class</code>, <code>rav60_category</code>).</li><li>Si un parámetro falta, la API lanza <code>MissingParameterError</code>: nunca usa un valor por defecto escondido.</li><li><code>recurso_grafico</code>: logo INAC y firma del presidente como bytea (≤ 500 KB), una fila por tipo.</li></ul>`, src:'packages/db/src/schema/parametros.ts, catalogos.ts' },
    { t:'Fotos en la base de datos (OD-03 resuelto)', b:`<p>Foto y firma del personal se guardan como <b>bytea</b> en <code>personal_aeronautico</code>, comprimidas por la API a ≤ 200 KB (D5). Adjuntos (PDF/JPEG/PNG ≤ 5 MB) en <code>personal_adjunto</code>.</p>`, why:'Render tiene disco efímero y no hay almacenamiento de objetos contratado. Con 9 usuarios y una sede, 200 KB por persona caben de sobra en PostgreSQL, viajan en el mismo respaldo y respetan las mismas transacciones. Si el volumen creciera, el cambio sería mover los bytes a almacenamiento de objetos y dejar una referencia.', src:'docs/plan-ejecucion-paralela.md D5, D21' },
    { t:'Conexión y entornos', b:`<ul><li><code>createDb(url)</code> crea un Pool de <code>pg</code>; si la URL trae <code>sslmode=require</code> (Neon) activa TLS con verificación de certificado.</li><li>Dos URLs: <b>pooled</b> para la API en ejecución y <b>directa</b> para migraciones y respaldos (pg_dump no es fiable a través de PgBouncer).</li><li>Errores de clientes inactivos (Neon escala a cero) se registran como advertencia, no tumban el proceso; el pool se cierra al apagar.</li><li>Local: docker compose con postgres:17; CI: contenedor de servicio postgres:17; producción: Neon Postgres 17.</li></ul>`, src:'packages/db/src/client.ts' },
    { t:'packages/types: el contrato', b:`<ul><li>Solo depende de <b>zod 4</b>.</li><li>Tuplas <code>as const</code> → enums de Postgres y tipos TS; <code>DERIVED_CREDENTIAL_STATUSES</code> existe solo en tipos (nunca en la base).</li><li><code>deriveCredentialStatus</code>, <code>can()</code> y la matriz, <code>normalizeCedula</code>, <code>medicalExpiryDate</code>, <code>canAccessReport</code>, <code>worstCredentialStatus</code>.</li><li>Esquemas por módulo: auth, personnel, users, settings, catalogs, blocking, licenses, medical-certificates, audit, reports, alerts, credentials, public-verify, common (paginación máx. 100).</li><li>Se consume desde el código fuente con la condición <code>@sryg/source</code>: tests y typecheck sin compilar antes.</li><li>16 archivos de prueba propios.</li></ul>`, src:'packages/types/src' },
    { t:'Pruebas de la capa de datos', b:`<ul><li><code>schema.int.test.ts</code> (457 líneas): la lista exacta de las 26 tablas, que <code>certificado_medico</code> no tiene columnas clínicas (BR-05), RESTRICT y CASCADE, unicidad insensible a mayúsculas, tokens de verificación distintos, una alerta por credencial y tipo, cada CHECK.</li><li><code>auditoria.int.test.ts</code>: INSERT pasa; UPDATE y DELETE fallan con P0001.</li><li><code>migrations.int.test.ts</code>: crea una base nueva, migra y comprueba los 4 placeholders.</li><li><code>client.test.ts</code>: TLS solo con sslmode.</li></ul>`, src:'packages/db/src/*.test.ts' },
  ],
  jury:[
    { k:'T', q:'Explica el modelo de datos y cómo garantizas la integridad referencial.', a:`<p>Un titular (<code>personal_aeronautico</code>) tiene N licencias, N certificados médicos y N bloqueos; cada licencia tiene N habilitaciones de tipo y de clase, y estas últimas N aeronaves. Todos los valores controlados (tipos de licencia, aeronaves, funciones, observaciones) son catálogos con FK. Las claves foráneas hacia el titular y hacia los catálogos son RESTRICT: no se puede borrar una persona con credenciales ni un catálogo en uso. Las derivadas (adjuntos, alertas) son CASCADE. Además, CHECK constraints codifican reglas (fechas coherentes, resolución de bloqueo consistente, formato de cédula) y la auditoría es solo-anexar por trigger.</p>` },
    { k:'T', q:'¿Por qué el estatus "próxima a vencer" no está en el enum de la base de datos?', a:`<p>Porque no es un hecho almacenable: depende del día de hoy y del umbral configurable. Guardarlo exigiría recalcular cada noche y aceptar ventanas de inconsistencia. Se deriva al leer con una función compartida por API y web. El enum <code>credential_status</code> conserva activa/vencida/bloqueada por compatibilidad con el esquema inicial, pero la decisión la toma la derivación (D17).</p>` },
    { k:'T', q:'¿Cómo versionas los cambios del esquema y cómo los aplicas en producción?', a:`<p>El esquema es código TypeScript con Drizzle; <code>drizzle-kit generate</code> produce migraciones SQL numeradas y un journal. Se aplican con el migrador de Drizzle, que registra cada archivo aplicado en una tabla de control, usando la conexión directa. En producción corren en el comando de arranque antes de levantar la API, con una sola instancia para evitar migradores concurrentes. Las migraciones son aditivas: revertir la API no deshace el esquema, y para un entorno desechable se recrea la base.</p>` },
    { k:'P', q:'¿Qué datos personales guarda el sistema y cómo los protege?', a:`<p>Datos administrativos del personal aeronáutico: cédula, nombres, contacto, fecha de nacimiento, tipo de sangre, cargo, foto y firma, más sus credenciales. Nunca datos clínicos. Protección: acceso solo con sesión y rol, cifrado en tránsito (TLS/HTTPS), contraseñas con argon2id, auditoría de cada acceso y cambio, respaldos cifrados con age y clave privada fuera de los servidores, y la página pública de verificación expone solo tipo, número, estado y vencimiento.</p>` },
    { k:'T', q:'¿Qué pasa si alguien registra dos personas con la misma cédula escrita distinto (V-12.345.678 y 12345678)?', a:`<p>La cédula se normaliza antes de guardarse (se quitan V, puntos y guiones) y la columna es única con formato de 6 a 9 dígitos verificado por CHECK. El segundo registro provoca un error 23505 en PostgreSQL que la API traduce a 409 "cédula duplicada". Es exactamente el problema de duplicidad que el diagnóstico identificó en las hojas de cálculo.</p>` },
  ],
  quiz:[
    { q:'¿Cuántas tablas de aplicación tiene el esquema?', o:['7','18','26','40'], a:2, e:'26 tablas, verificadas por una prueba que compara la lista exacta.' },
    { q:'¿Qué ocurre al ejecutar UPDATE sobre la tabla auditoria?', o:['Se actualiza','Se registra como cambio','Falla con una excepción del trigger','Se convierte en INSERT'], a:2, e:'El trigger auditoria_immutable lanza RAISE EXCEPTION (SQLSTATE P0001) ante UPDATE o DELETE.' },
    { q:'¿Qué regla de borrado tiene la FK de licencia hacia la persona?', o:['CASCADE','SET NULL','RESTRICT','NO ACTION diferido'], a:2, e:'RESTRICT: BR-10, ninguna credencial sin titular; la API responde 409 al intentar borrar.' },
    { q:'¿Por qué alerta.credential_id no tiene clave foránea?', o:['Por descuido','Porque es polimórfico: apunta a licencia, habilitación o certificado','Porque las alertas son temporales','Porque Drizzle no soporta FKs'], a:1, e:'credential_kind indica a qué tabla pertenece; por eso no puede haber una sola FK.' },
    { q:'¿Qué URL usa el migrador en producción?', o:['La pooled de Neon','La directa (sin -pooler)','localhost','Ninguna, migra a mano'], a:1, e:'DATABASE_MIGRATION_URL es la conexión directa; la pooled (PgBouncer) es para la API en ejecución.' },
    { q:'¿Dónde se guarda la foto del personal?', o:['En el disco del servidor','En S3','Como bytea en personal_aeronautico, ≤ 200 KB','En el navegador'], a:2, e:'D5: comprimida por sharp y almacenada en la base; viaja con el respaldo y las transacciones.' },
  ],
});

  intro:'Cómo se construye, se prueba, se despliega y se respalda el sistema. Es donde la tesis dice "disponibilidad > 99 %" y "respaldos automáticos", y el repositorio lo cumple.',
  jokes:['El respaldo corre a las 3:17 de la madrugada hora Caracas. A esa hora solo están despiertos el pg_dump y el que tiene examen.','Render gratis se duerme a los minutos de inactividad; el primer request tarda un minuto. Como el funcionario después del almuerzo.'],
  cards:[
    { t:'Desarrollo local', b:`<pre>pnpm db:up        # docker compose: postgres:17 con healthcheck
pnpm db:migrate   # aplica packages/db/migrations
pnpm db:seed      # 10 catálogos, 9 usuarios, 50 personas ficticias (determinista)
pnpm dev          # Vite en :5173; la API en :3000 con node --watch</pre><p>Variables en <code>.env</code> (ver <code>.env.example</code>): URLs de BD, <code>JWT_SECRET</code>, <code>CORS_ORIGIN</code>. El seed de desarrollo se niega a correr con <code>NODE_ENV=production</code>.</p>`, src:'package.json, docker-compose.yml, .env.example' },
    { t:'Integración continua (GitHub Actions)', b:`<pre>on: push (toda rama) y pull_request → main
services: postgres:17 (sryg_test)
steps: install --frozen-lockfile → format:check → lint → build:packages
       → typecheck → db:migrate → test (todos los paquetes) → build</pre><p>Un solo job, sin secretos (JWT de prueba fijo). Las pruebas de integración migran y usan esa base real. La concurrencia cancela ejecuciones anteriores de la misma rama.</p>`, why:'NFR-12 pide pruebas unitarias e integración. Que corran contra PostgreSQL real en cada push es lo que valida constraints y triggers, no solo lógica.', src:'.github/workflows/ci.yml' },
    { t:'Despliegue: Render + Neon (render.yaml)', b:`<ul><li><b>sryg-web:</b> sitio estático; build con pnpm, publica <code>apps/web/dist</code>, reescribe <code>/*</code> a <code>index.html</code> (SPA), assets inmutables con caché de un año.</li><li><b>sryg-api:</b> servicio Node (plan gratuito); arranque: <code>node packages/db/dist/migrate.js &amp;&amp; node apps/api/dist/main.js</code>; healthcheck en <code>/health</code>.</li><li><b>Base de datos:</b> Neon (Postgres 17 serverless), URLs como secretos del panel; no hay bloque <code>databases</code>.</li><li>Variables: <code>DATABASE_URL</code> (pooled), <code>DATABASE_MIGRATION_URL</code> (directa), <code>JWT_SECRET</code> (generado por Render), <code>CORS_ORIGIN</code>, <code>VITE_API_URL</code> (se incrusta en el build).</li><li>Cada merge a <code>main</code> que toque los paths del servicio lo redespliega.</li></ul>`, why:'OD-02 se resolvió hacia Render para validar con usuarios reales a bajo costo. La tesis propone red local; la arquitectura es la misma: docker compose + Node en un servidor del INAC es el despliegue on-premise equivalente.', src:'render.yaml, docs/deploy.md' },
    { t:'Primer despliegue y usuario inicial', b:`<ol style="margin:0;padding-left:18px"><li>Sincronizar el blueprint y cargar los secretos a mano.</li><li>El primer arranque aplica las 3 migraciones a la base vacía.</li><li>Configurar <code>VITE_API_URL</code> y redesplegar la web.</li><li>Crear el administrador desde la máquina del operador: <code>pnpm db:seed:admin</code> con <code>SEED_ADMIN_EMAIL/PASSWORD/NAME</code> (idempotente; nunca guarda credenciales en Render).</li><li>Prueba de humo: <code>/health</code> 200, <code>/health/ready</code> 200, login devuelve token.</li></ol>`, src:'docs/deploy.md' },
    { t:'Respaldos automáticos (NFR-10, OPS-01)', b:`<pre># scripts/backup.sh
pg_dump --format=custom --dbname="$DATABASE_URL" | age -r &lt;clave pública&gt; -o sryg-&lt;fecha&gt;.dump.age</pre><ul><li>GitHub Action diaria a las 07:17 UTC (03:17 Caracas) y a demanda; sube el archivo como artifact con 30 días de retención.</li><li>El volcado en claro <b>nunca toca el disco</b>: se cifra en el mismo pipe.</li><li>Rechaza la URL pooled (pg_dump no es fiable a través de PgBouncer).</li><li>RPO de 24 horas; 30 días de historial.</li></ul>`, src:'scripts/backup.sh, .github/workflows/backup.yml' },
    { t:'Restauración y simulacro (OPS-02)', b:`<ul><li><code>restore.sh --identity clave --target url archivo.dump.age</code>: descifra, valida con <code>pg_restore --list</code>, restaura en <b>una sola transacción</b> y cuenta tablas y migraciones.</li><li>Guardas: nunca usa <code>DATABASE_URL</code> como destino, rechaza el mismo host/base que producción, exige <code>--allow-remote</code> y confirmar el nombre de la base para destinos remotos.</li><li><code>backup-restore.test.sh</code>: 15 pruebas de guardas y un ciclo completo (250 filas con bytea, respaldo, verificación de cabecera cifrada, restauración y comparación de checksum).</li><li>Simulacro registrado el 14/10/2026: 27 tablas (26 + la de control de migraciones) y 3 migraciones. Simulacro trimestral programado.</li></ul>`, why:'Un respaldo que nunca se ha restaurado no es un respaldo. El simulacro documentado es la prueba de OPS-02.', src:'scripts/restore.sh, docs/respaldos.md' },
    { t:'Cifrado (NFR-11, OPS-05)', b:`<ul><li><b>En reposo:</b> respaldos con age (X25519 + ChaCha20-Poly1305); la clave privada vive en el gestor de contraseñas y una copia offline, nunca en GitHub ni Render. El almacenamiento de Neon está cifrado.</li><li><b>En tránsito:</b> TLS a la base (<code>sslmode=require</code> con verificación), HTTPS entre navegador y API, y entre Render y Neon.</li><li><b>Contraseñas:</b> argon2id.</li><li>Rotación de claves de respaldo con 30 días de solapamiento.</li></ul>`, why:'La tesis exige cifrado sin especificar mecanismo; esta es la respuesta concreta por capa.', src:'docs/respaldos.md §1' },
    { t:'Límites honestos del hosting gratuito', b:`<ul><li>Render free se duerme tras inactividad: el primer request tarda cerca de un minuto. Neon escala a cero: la primera consulta es más lenta.</li><li><code>/health</code> no toca la base a propósito para no mantener Neon despierto; <code>/health/ready</code> sí.</li><li>Sin SLA: es un entorno de <b>validación</b>, no de producción. Para producción en el INAC: servidor local con docker compose o un plan de pago.</li><li>Rollback: redesplegar una versión anterior; las migraciones son aditivas.</li></ul>`, src:'docs/deploy.md "Limits and cold starts"' },
    { t:'Cómo se organizó el trabajo (plan de ejecución)', b:`<ul><li>Fuente única: <code>docs/plan-ejecucion-paralela.md</code> con 25 decisiones (D1 a D25) y análisis de brechas contra SLYM.</li><li><b>Ola 0</b> (secuencial): cimientos de API y web, una sola migración, módulos y rutas pre-registrados para evitar conflictos.</li><li><b>Ola 1:</b> 11 ramas en paralelo, una por funcionalidad, cada una tocando solo su carpeta.</li><li>Compuerta de diseño humana, <b>Ola 2</b> (panel y PDF), <b>Ola 3</b> (cierre e integración).</li><li>Reglas: sin migraciones nuevas en olas 1-2, sin dependencias no autorizadas, TDD con datos ficticios, Conventional Commits, checks obligatorios antes de cada PR.</li><li>Metodología de especificación: openspec (<code>strict_tdd: true</code>: primero la prueba que falla).</li></ul>`, why:'Esto es la "codificación" de la cascada llevada a la práctica: requisitos y diseño cerrados antes, construcción disciplinada después.', src:'docs/plan-ejecucion-paralela.md, openspec/config.yaml' },
  ],
  jury:[
    { k:'T', q:'¿Cómo garantizas la disponibilidad y qué pasa si se cae la base de datos?', a:`<p>La API expone dos sondas: <code>/health</code> (proceso vivo) y <code>/health/ready</code> (hace <code>select 1</code> y devuelve 503 si la base no responde). El pool tolera caídas de conexiones inactivas sin reiniciar el proceso. En el despliegue de validación la plataforma reinicia el servicio si la sonda falla. Para el objetivo de más del 99 % en red local, la recomendación es un servidor del INAC con docker compose, PostgreSQL local y el mismo job de respaldo. Los respaldos diarios cifrados y el simulacro de restauración cubren el peor caso: pérdida total de la base con RPO de un día.</p>` },
    { k:'T', q:'¿Cómo pruebas que un respaldo sirve?', a:`<p>Con un script de prueba que ejecuta el ciclo completo contra una base temporal: carga 250 filas con binarios, hace el respaldo, verifica que el archivo empiece con la cabecera de age y no contenga texto en claro, lo restaura en otra base y compara un checksum de ambas. Además se hizo un simulacro documentado el 14 de octubre de 2026 y hay un calendario trimestral. El script de restauración tiene guardas para no restaurar por accidente sobre producción.</p>` },
    { k:'P', q:'La tesis dice "red local" y el sistema está en la nube. ¿Contradicción?', a:`<p>No: la arquitectura es la misma; cambia dónde corre. La tesis propone hosting en la red local del INAC. Para validar con usuarios reales sin esperar infraestructura institucional se desplegó en Render y Neon (decisión OD-02, documentada). El repositorio incluye docker compose y los scripts necesarios para instalarlo en un servidor local, y las pruebas de integración corren contra PostgreSQL local todos los días en CI. Es una decisión de entrega, no de diseño.</p>` },
    { k:'T', q:'¿Qué hace tu pipeline de integración continua y por qué en ese orden?', a:`<p>Instala con lockfile congelado, verifica formato, lint, compila los paquetes compartidos, hace typecheck en todos los workspaces, migra una base PostgreSQL de servicio, ejecuta todas las pruebas y finalmente construye los artefactos. El orden va de lo más barato a lo más caro: un error de formato se detecta en segundos sin levantar una base. Corre en cada push y en cada pull request a main.</p>` },
    { k:'P', q:'¿Quién mantiene esto cuando termines la tesis?', a:`<p>Está pensado para ser heredable: estructura convencional de NestJS y React, documentación en el repositorio (definiciones, decisiones, despliegue, respaldos, convenciones de UI), pruebas automáticas que avisan si algo se rompe, un seed de datos ficticios para entrenar y un runbook de operación. La reorganización a una estructura simple se hizo justamente para que personal del INAC o futuros estudiantes lo entiendan sin formación en arquitectura hexagonal.</p>` },
  ],
  quiz:[
    { q:'¿Con qué se cifran los respaldos?', o:['ZIP con contraseña','age (X25519 + ChaCha20-Poly1305)','GPG simétrico','No se cifran'], a:1, e:'pg_dump se canaliza directamente a age; el volcado en claro nunca se escribe en disco.' },
    { q:'¿Cuál es el RPO del esquema de respaldos?', o:['1 hora','24 horas','7 días','30 días'], a:1, e:'Respaldo diario: se pierde como máximo un día. Se conservan 30 días.' },
    { q:'¿Qué paso del CI usa PostgreSQL real?', o:['format:check','lint','db:migrate y las pruebas','build'], a:2, e:'Las pruebas de integración de api y db corren contra el contenedor postgres:17 del job.' },
    { q:'¿Cuándo corren las migraciones en producción?', o:['Manualmente por SSH','En el comando de arranque, antes de la API','Nunca','En cada request'], a:1, e:'preDeployCommand es de pago; por eso migrate.js corre en startCommand con una sola instancia.' },
    { q:'¿Por qué /health no consulta la base?', o:['Por pereza','Para no mantener Neon despierto; /health/ready sí la consulta','Porque no tiene acceso','Porque es público'], a:1, e:'Liveness sin BD; readiness con select 1 y 503 si falla.' },
  ],
});

ZONES.push({
  id:'academia', name:'La Academia', icon:'🎓', tag:'Marco metodológico y legal (Cap. II y III)', walls:['#e7dcc4','#c9bb9c'], roof:['#7a4a8a','#5e386b'],
  intro:'Lo que el jurado metodológico pregunta sí o sí: tipo y diseño de investigación, fases, técnicas, variables, KR-20, población, cascada, UML y bases legales.',
  jokes:['Proyecto factible, descriptivo, proyectivo y tecnológico. Suena a horóscopo, pero cada palabra tiene su autor citado.','KR-20 no es un modelo de Kawasaki: es el coeficiente de confiabilidad para cuestionarios dicotómicos.'],
  cards:[
    { t:'Tipo, nivel y naturaleza de la investigación', b:`<ul><li><b>Nivel descriptivo</b> (Arias, 2012): caracterizar el estado actual de los flujos manuales en INAC Maracay.</li><li><b>Tipo proyectivo</b> (Hurtado, 1998): diseñar una propuesta que transforme la situación.</li><li><b>Naturaleza tecnológica</b> (García Córdoba, 2007): instrumental y orientada a construir un artefacto.</li><li><b>Método:</b> Proyecto Factible (Manual de Trabajo de Grado IUPSM, 2015): "propuesta de un modelo funcional viable a un problema práctico".</li><li><b>Diseño mixto:</b> de campo (datos primarios en la sede) y documental (RAV 60, RAV 67, ISO 25010 y 27001).</li></ul>`, src:'thesis.docx Cap. III, tipo y método' },
    { t:'Fases de la investigación (proyecto factible)', b:`<ol style="margin:0;padding-left:18px"><li><b>Diagnóstico:</b> levantamiento en la Sede Regional: procesos de taquilla, mermas de tiempo en consulta de carpetas, ausencia de alertas.</li><li><b>Alternativas de solución:</b> análisis comparativo que justifica TypeScript y PostgreSQL (ACID, concurrencia, Ley de Infogobierno).</li><li><b>Propuesta:</b> diseño detallado, modelado UML, codificación de módulos y verificación de calidad.</li></ol>`, why:'Relaciona cada fase con un objetivo específico: diagnóstico ↔ objetivo 1 y 2; alternativas ↔ objetivo 4 (lenguajes y SGBD); propuesta ↔ objetivos 3, 4 y 5.', src:'thesis.docx "Fases de la investigación"' },
    { t:'Técnicas e instrumentos', b:`<ul><li><b>Observación directa</b> no participativa en la taquilla técnica, con <b>bloc de notas</b> como instrumento.</li><li><b>Encuesta</b> con <b>cuestionario dicotómico</b> (sí/no) de <b>10 ítems</b>.</li><li><b>Revisión documental</b> de RAV 60, RAV 67, ISO/IEC 25010 e ISO/IEC 27001.</li><li>Tratamiento: estadística descriptiva (tablas de frecuencia, porcentajes).</li></ul>`, src:'thesis.docx "Técnicas para la recolección"' },
    { t:'Sistema de variables (Cuadro 1)', b:`<div class="tbl"><table><tr><th>Objetivo</th><th>Variable</th><th>Dimensión</th><th>Indicadores (ítems)</th></tr><tr><td>1. Diagnosticar</td><td>Gestión de credenciales (situación actual)</td><td>Diagnóstico operacional</td><td>Tiempos de consulta física (1), errores de transcripción (2), duplicidad de registros (3), vencimiento inadvertido de licencias (4), caducidad de certificados médicos (5)</td></tr><tr><td>2. Determinar requerimientos</td><td>Sistema automatizado de gestión</td><td>Especificación de requisitos y calidad</td><td>Búsqueda centralizada (6), restricción de accesos y roles (7), respaldo automatizado (8), alertas de vencimiento (9), validación y control normativo (10)</td></tr></table></div><p>La operacionalización llega solo hasta el segundo objetivo específico, por corrección de la coordinación académica.</p>`, why:'Fíjate cómo cada indicador 6-10 es un módulo real del sistema: búsqueda, roles, respaldos, alertas, validación. La tesis y el código están alineados.', src:'thesis.docx Cuadro 1' },
    { t:'Confiabilidad: Kuder-Richardson (KR-20)', b:`<p>Para un cuestionario dicotómico se usa KR-20: <code>r = (N/(N−1)) · (1 − Σ(p·q)/Vt)</code>, donde N = 10 ítems, p = proporción de "sí" por ítem, q = 1 − p y Vt = varianza total.</p><div class="tbl"><table><tr><th>Rango</th><th>Confiabilidad</th></tr><tr><td>0,81 a 1,00</td><td>Muy alta</td></tr><tr><td>0,61 a 0,80</td><td>Alta</td></tr><tr><td>0,41 a 0,60</td><td>Moderada</td></tr><tr><td>0,21 a 0,40</td><td>Baja</td></tr></table></div><p>Fuente de la escala: Palella y Martins (2012).</p>`, why:'Si preguntan por qué KR-20 y no Alfa de Cronbach: Cronbach es para escalas politómicas (Likert); KR-20 es su caso particular para ítems dicotómicos.', src:'thesis.docx Ecuación 1, Cuadro 2' },
    { t:'Población y muestra', b:`<p>Población <b>finita</b>: el personal de la Gerencia General de Seguridad Aeronáutica de la sede Maracay vinculado a licencias, rampa y habilitaciones. Por ser pequeña y accesible se aplicó <b>censo totalitario</b> (muestra = población = 9).</p><div class="tbl"><table><tr><th>Estrato</th><th>Población</th><th>Muestra</th></tr><tr><td>Taquilla Técnica de Licencias</td><td>4</td><td>4</td></tr><tr><td>Supervisores de Seguridad Aeronáutica</td><td>2</td><td>2</td></tr><tr><td>Inspectores de Seguridad en Rampa</td><td>3</td><td>3</td></tr><tr><td><b>Total</b></td><td><b>9</b></td><td><b>9</b></td></tr></table></div>`, why:'Con nueve personas no tiene sentido muestrear: un censo elimina el error muestral (Coelho, 2016; Ramírez, 2019).', src:'thesis.docx Cuadro 3' },
    { t:'Ciclo de vida: Modelo en Cascada', b:`<ol style="margin:0;padding-left:18px"><li><b>Análisis de requisitos:</b> funcionales desde RAV 60/67 (bloqueo, perfiles), no funcionales desde ISO 25010 (disponibilidad &gt; 99 %, latencia &lt; 3 s).</li><li><b>Diseño:</b> arquitectura cliente-servidor, base de datos, modelos UML, interfaz.</li><li><b>Codificación:</b> TypeScript en frontend y backend; PostgreSQL.</li><li><b>Pruebas:</b> unitarias, integración, aceptación de usuario, carga concurrente, seguridad.</li><li><b>Mantenimiento:</b> correctivo, adaptativo (cambios regulatorios) y perfectivo.</li></ol><p>Fundamento: Pressman (2010) y el enfoque plan-driven de Sommerville (2011).</p>`, why:'¿Por qué cascada y no ágil? Porque los requisitos vienen de regulaciones estables y el entorno es gubernamental aeronáutico: se privilegia rigidez, trazabilidad y documentación previa. En la práctica, dentro de cada fase hubo iteración controlada (especificación → prueba → código), lo cual es compatible con un modelo plan-driven.', src:'thesis.docx "Fases o etapas del desarrollo"' },
    { t:'Modelado: suite de 9 diagramas UML', b:`<p>Siguiendo a la OMG (2015): <b>casos de uso, clases, objetos, máquina de estados, secuencia, actividades, comunicación, componentes y despliegue</b>.</p><p>La máquina de estados documenta el ciclo de la licencia (Activa, Vencida, Bloqueada); el de componentes nombra <code>GeneradorCredencialPDF</code> dependiendo de <code>ValidadorVigenciaRAV60</code>; el de despliegue muestra navegador, servidor Node y PostgreSQL.</p>`, why:'Si preguntan qué diagrama fue más útil: el de máquina de estados, porque se convirtió directamente en la función que deriva el estatus; y el de clases, que se volvió el esquema de Drizzle.', src:'thesis.docx "Herramientas a aplicar", figura 1' },
    { t:'Bases legales', b:`<ul><li><b>Constitución (1999), art. 156 num. 26:</b> competencia nacional sobre aviación civil.</li><li><b>Ley de Aeronáutica Civil (2009, G.O. 39.140):</b> el INAC regula, fiscaliza y supervisa el cumplimiento de las RAV.</li><li><b>Anexo 1 OACI (2022):</b> licencias al personal; estándares internacionales.</li><li><b>RAV 60</b> (licencias) y <b>RAV 67</b> (certificado médico aeronáutico).</li><li><b>Ley de Infogobierno:</b> software libre y estándares abiertos (art. 34).</li><li><b>Ley Especial contra los Delitos Informáticos:</b> control de acceso, autenticación, registro.</li><li><b>LOPA</b>, <b>Ley Orgánica del Sistema Venezolano para la Calidad</b>, <b>Ley Orgánica de Ciencia, Tecnología e Innovación</b>.</li></ul>`, src:'thesis.docx "Bases legales"' },
    { t:'Antecedentes y estado del arte', b:`<ul><li>Baladi y Márquez (2022): gestión de certificación profesional en seguridad; automatización centralizada.</li><li>Primera (2024, UCV): sistema integrado de gestión de bibliotecas; de procesos manuales a automatizados.</li><li>Rivera (2024, Piura): sistema web para gestión de credenciales de servidores; 87,5 % consideró necesaria la herramienta.</li><li>Quispe y Quispe (2024) y Quispe (2025, UDEA): control de asistencia; 78,6 % de optimización, Rho de Spearman 0,724.</li><li><b>Estado del arte:</b> programa e-license de OACI (licencias electrónicas con verificación en rampa) y sistemas públicos venezolanos (SENIAT, SISCON) sin la flexibilidad para el personal aeronáutico.</li></ul>`, src:'thesis.docx Cap. II' },
    { t:'Cronograma (Cuadro 4)', b:`<p>15 semanas, naturaleza plan-driven: introducción y estructura, cronograma de entregas, revisión y cambio de verbos a pasado, asesorías, borrador al tutor, correcciones, conversatorio sobre la exposición, pre-entrega y entrega de la rústica, entrega al jurado, <b>pre-defensa</b>, <b>defensa</b> y entrega del tomo definitivo.</p>`, src:'thesis.docx Cuadro 4' },
    { t:'Puente: cada fase de la cascada tiene evidencia en el repositorio', b:`<div class="tbl"><table><tr><th>Fase</th><th>Evidencia</th></tr><tr><td>Requisitos</td><td><code>docs/sryg-definitions-and-tasks.md</code>: BR-01..14, NFR-01..12, matriz de roles, decisiones abiertas</td></tr><tr><td>Diseño</td><td><code>docs/design-brief-runbook.md</code>, <code>openspec/changes/*</code>, esquema Drizzle, 6 plantillas, diagramas UML de la tesis</td></tr><tr><td>Codificación</td><td>apps/api, apps/web, packages; 106 commits, 20 PRs; plan de olas</td></tr><tr><td>Pruebas</td><td>92 archivos, CI en cada push con PostgreSQL real; simulacro de restauración</td></tr><tr><td>Mantenimiento</td><td>Refactor a estructura simple (15/10/2026), runbooks de despliegue y respaldos, parámetros editables para cambios regulatorios</td></tr></table></div>`, why:'Esta tabla es tu mejor aliada si el jurado duda de que la cascada se aplicó de verdad.', src:'repositorio' },
  ],
  jury:[
    { k:'P', q:'¿Por qué Modelo en Cascada y no una metodología ágil?', a:`<p>Porque los requisitos nacen de regulaciones estables (RAV 60, RAV 67, Anexo 1) y el cliente es un organismo público aeronáutico que exige documentación previa, trazabilidad y entregas formales. La cascada, en su versión plan-driven, fija requisitos y diseño antes de codificar y produce los artefactos (UML, especificaciones) que la institución y la universidad requieren. Dentro de cada fase hubo verificación continua (pruebas automáticas desde el primer módulo), lo que es compatible con el modelo y reduce su riesgo clásico de descubrir errores tarde.</p>` },
    { k:'P', q:'¿Qué tipo de investigación es y por qué?', a:`<p>Es un proyecto factible, de nivel descriptivo, tipo proyectiva y naturaleza tecnológica, con diseño mixto de campo y documental. Descriptivo porque primero caracteriza el proceso manual actual; proyectiva porque propone una solución que transforma esa realidad; tecnológica porque el producto es un artefacto de software; de campo porque los datos se recogieron en la sede con observación y encuesta; documental porque las reglas se extrajeron de las regulaciones y normas ISO.</p>` },
    { k:'P', q:'¿Cómo validaste el instrumento y por qué KR-20?', a:`<p>El instrumento es un cuestionario cerrado dicotómico de diez ítems alineados con los indicadores del cuadro de operacionalización. Para la consistencia interna de ítems dicotómicos corresponde el coeficiente de Kuder-Richardson 20, caso particular del Alfa de Cronbach. El resultado se interpreta con la escala de Palella y Martins, donde 0,81 a 1,00 es muy alta.</p>`, tip:'Lleva el valor obtenido de KR-20 y el porcentaje de respuestas por ítem; si el jurado pide el cálculo, muéstralo con la fórmula.' },
    { k:'P', q:'Con nueve encuestados, ¿los resultados son válidos?', a:`<p>Sí, porque no se trata de inferir a una población mayor: se censó al 100 % de las personas que ejecutan el proceso en la sede estudiada. La validez es de contenido y de pertinencia: respondieron quienes viven el problema a diario. La delimitación espacial a Maracay es coherente con ese censo.</p>` },
    { k:'P', q:'¿Cómo cumpliste el quinto objetivo, validar con pruebas de usuario?', a:`<p>En dos niveles: pruebas automáticas (unitarias e integración, más de 700 casos que corren en cada cambio contra PostgreSQL real) que verifican las reglas normativas, y validación con los usuarios sobre la versión desplegada con datos ficticios que reproducen los catálogos reales de SLYM: registro, emisión con bloqueo, alertas y verificación en rampa. Las observaciones de esa validación alimentan las decisiones pendientes con INAC (umbral, vigencias, permisos).</p>`, tip:'Si tienes actas o evidencia de la sesión con usuarios, menciónalas.' },
    { k:'P', q:'¿Qué normas ISO usas y para qué?', a:`<p>ISO/IEC 25010 como modelo de calidad del producto: guía los requisitos no funcionales (adecuación funcional, fiabilidad, mantenibilidad, seguridad, eficiencia con latencia menor a 3 segundos). ISO/IEC 27001 como referencia de seguridad de la información: control de acceso por roles, autenticación con tokens firmados, auditoría inmutable, cifrado y respaldos. Se usan como marcos de alineación, no como certificación.</p>` },
  ],
  quiz:[
    { q:'¿Qué modalidad metodológica rige la tesis?', o:['Investigación experimental','Proyecto factible','Estudio de caso etnográfico','Investigación correlacional'], a:1, e:'Proyecto factible según el Manual de Trabajo de Grado del IUPSM (2015).' },
    { q:'¿Qué coeficiente se usa para la confiabilidad del cuestionario?', o:['Alfa de Cronbach','Rho de Spearman','Kuder-Richardson 20','Chi cuadrado'], a:2, e:'KR-20, porque el cuestionario es dicotómico (sí/no) con 10 ítems.' },
    { q:'¿Cuántos diagramas UML se especificaron?', o:['3','5','9','14'], a:2, e:'Nueve: casos de uso, clases, objetos, máquina de estados, secuencia, actividades, comunicación, componentes y despliegue.' },
    { q:'¿Cuál es la primera fase del Modelo en Cascada según la tesis?', o:['Diseño','Codificación','Análisis de requisitos','Pruebas'], a:2, e:'Requisitos → diseño → codificación → pruebas → mantenimiento (Pressman, 2010).' },
    { q:'¿Qué tipo de muestreo se aplicó?', o:['Aleatorio simple','Estratificado proporcional','Censo totalitario','Por conveniencia'], a:2, e:'Población finita y pequeña (9): se encuesta al 100 %.' },
    { q:'¿Qué instrumento acompaña a la observación directa?', o:['Grabadora','Bloc de notas','Cuestionario Likert','Entrevista estructurada'], a:1, e:'El bloc de notas registra cronológicamente las incidencias y mermas de tiempo observadas.' },
  ],
});
