<script>
// ===== Zona 9: Sala del Jurado (jefe final) =====
ZONES.push({
  id:'jurado', name:'Sala del Jurado', icon:'⚖️', tag:'Simulacro de defensa', boss:true, walls:['#e8e4ef','#c6bfd3'], roof:['#2b2b2b','#151515'],
  intro:'El jefe final. Tarjetas aleatorias de todas las zonas, mezclando jurado de producto y jurado técnico, más las preguntas incómodas que conviene tener respondidas antes de que las hagan.',
  jokes:['Respira. Tres pasos: qué decidiste, por qué, y dónde vive en el sistema. Lo demás es cuento de camino.','El jurado técnico va a buscar la grieta; el de producto, el sentido. Tú tienes las dos cosas en este mapa.'],
  cards:[], jury:[], quiz:[],
});

// Banco del simulacro: k = P (producto) o T (técnico); z = zona de origen
const BOSS = [
  { k:'P', z:'La Taquilla', q:'Cuéntame en un minuto qué es SRYG y qué problema resuelve.', a:'Es un sistema web para que la oficina del INAC en Maracay gestione licencias, habilitaciones y certificados médicos del personal aeronáutico en un expediente electrónico único, en lugar de carpetas físicas y hojas de cálculo. Valida el estatus automáticamente, bloquea la emisión cuando hay un impedimento, alerta vencimientos, deja auditoría de todo y restringe el acceso por rol. Resuelve lentitud, duplicidad, errores y el riesgo de que alguien opere con credenciales vencidas.' },
  { k:'P', z:'La Taquilla', q:'¿Cuál fue tu diagnóstico y con qué instrumentos lo hiciste?', a:'Observación directa en la taquilla con bloc de notas y un cuestionario dicotómico de diez ítems aplicado a los nueve funcionarios (censo). Los indicadores: tiempos de consulta física, errores de transcripción, duplicidad, vencimientos inadvertidos de licencias y caducidad de certificados médicos.' },
  { k:'T', z:'El Archivo', q:'¿Cómo representas el estado "bloqueada" si la tabla de licencias no lo guarda?', a:'Existe una tabla bloqueo por titular con estado activo o resuelto y un índice parcial sobre los activos. Al leer cualquier credencial se consulta si el titular tiene un bloqueo activo y, si lo tiene, el estado derivado es bloqueada, por encima de las fechas. Así un solo bloqueo afecta a todas las credenciales de la persona sin tocar sus filas.' },
  { k:'T', z:'El Archivo', q:'¿Qué significa "próxima a vencer" numéricamente?', a:'Días restantes hasta el vencimiento menores o iguales al umbral configurado en parametro_sistema (clave alerts.threshold_days). El valor provisional es 30 y está marcado como pendiente de INAC. Vencida es desde el día siguiente al vencimiento.' },
  { k:'P', z:'El Archivo', q:'¿Qué tipos de impedimento maneja el sistema y quién los registra?', a:'Administrativo, médico y regulatorio, con motivo obligatorio. Los registran y resuelven Administrador y Supervisor; Consulta solo los ve. La resolución exige nota y queda auditada; los bloqueos no se borran nunca.' },
  { k:'T', z:'Torre de Control', q:'Dibuja el flujo de una petición autenticada hasta la base de datos.', a:'Navegador → fetchJson con Bearer → NestJS: JwtAuthGuard (verifica HS256 y pone user) → PermissionGuard (can con rol y área) → ZodValidationPipe (400 si inválido) → Controller → Service (reglas) → TransactionRunner (transacción) → repositorios Drizzle → PostgreSQL (constraints y trigger) → respuesta, o DomainExceptionFilter que mapea NotFound 404, Conflict 409, Forbidden 403.' },
  { k:'T', z:'Torre de Control', q:'¿Por qué TypeScript en el servidor y no Java o Python?', a:'Un solo lenguaje de punta a punta permite compartir los contratos (zod), los enums y la matriz de permisos entre cliente y servidor, con verificación de tipos en ambos lados. Node maneja bien la I/O concurrente de una API de consultas. Y todo el stack es software libre, como pide la Ley de Infogobierno. La tesis lo fundamenta en la fase de alternativas de solución.' },
  { k:'P', z:'Torre de Control', q:'¿Qué significa que el sistema sea "transaccional"?', a:'Que cada operación de negocio (emitir, renovar, bloquear, resolver) se registra como una transacción completa o no se registra: atomicidad, consistencia, aislamiento y durabilidad (ACID). En SRYG cada una de esas operaciones corre en una transacción de PostgreSQL junto con su fila de auditoría.' },
  { k:'T', z:'El Hangar', q:'¿Cómo evitas ataques de fuerza bruta en el login?', a:'Throttling por IP con @nestjs/throttler: cinco intentos por minuto por defecto, configurable; el 429 lleva Retry-After y la web muestra la cuenta regresiva. Además cada intento se registra en acceso_usuario y en auditoría, las contraseñas se guardan con argon2id y el mensaje de error es el mismo para cualquier fallo.' },
  { k:'T', z:'El Hangar', q:'¿Qué contiene el JWT y cuánto dura? ¿Se revoca?', a:'sub (id), email, role y area, firmado con HS256 y un secreto de al menos 32 bytes; dura 3600 segundos. No hay lista de revocación ni refresh: la duración corta y el almacenamiento en sessionStorage limitan el riesgo. Desactivar un usuario invalida sus llamadas a /auth/me y a cambio de contraseña; las demás rutas confían en el token hasta que expira. Es una decisión documentada (D4) y una mejora futura si INAC la pide.' },
  { k:'T', z:'El Hangar', q:'¿Qué hace exactamente el servicio de emisión de licencia?', a:'Dentro de una transacción: carga la persona y el tipo de licencia (debe estar activo), comprueba que no haya bloqueo activo (409), comprueba la coherencia con el certificado médico de la clase exigida (409), calcula el vencimiento con la vigencia del tipo (o nulo si no vence; 409 si falta configurar), inserta la licencia con número por defecto igual a la cédula y token de verificación, aplica observaciones y habilitaciones, y escribe la auditoría "emitir".' },
  { k:'P', z:'El Hangar', q:'¿Qué reportes recibe la Directiva?', a:'Vencimientos (vencidas y próximas, las más urgentes primero), estado consolidado por persona (peor estado o sin credenciales) y bloqueos activos. Con filtros por texto, tipo, categoría RAV 60, estado y fechas; exportables a CSV y PDF con fecha de referencia y umbral. Cada exportación queda auditada.' },
  { k:'T', z:'El Hangar', q:'¿Cómo generas la credencial física y cómo se verifica?', a:'Un PDF CR80 de dos caras con pdfkit, con foto y firma del titular, logo y firma institucional desde la base, y un QR que apunta a /verificar/<token>. La página pública responde solo tipo, número, estado y vencimiento. No se genera si hay bloqueo activo o la credencial está vencida, y la emisión del PDF queda en auditoría.' },
  { k:'T', z:'La Pista', q:'¿Cómo decide la web qué puede ver cada usuario?', a:'Con la misma función can(rol, área, módulo, acción) que usa la API, leída de packages/types. RequirePermission envuelve cada ruta y muestra 403 si no aplica; la navegación filtra sus grupos con la misma función; y cada acción del expediente se autoexcluye si no tiene permiso. El rol siempre viene de /api/auth/me.' },
  { k:'P', z:'La Pista', q:'Muéstrame cómo un funcionario de taquilla emite una licencia.', a:'Busca a la persona por cédula, abre el expediente, pulsa "Emitir o renovar". Si hay bloqueo, ve el impedimento y no hay formulario. Si no, elige tipo, fecha de emisión, observaciones y habilitaciones; el riel lateral le muestra el vencimiento proyectado y cualquier problema de coherencia antes de confirmar. Al confirmar, la licencia aparece en la pestaña Licencias con su lámpara de estado y puede imprimir la credencial.' },
  { k:'T', z:'La Pista', q:'¿Qué significa que el estado "nunca se transmite solo por color"?', a:'WCAG 1.4.1: cada lámpara combina relleno o contorno, icono (candado, equis, reloj, check) y etiqueta de texto. Una persona daltónica o una tablet bajo el sol siguen distinguiendo vencida de activa. Y "sin datos" nunca se parece a "activa".' },
  { k:'T', z:'La Bóveda', q:'Nombra tres restricciones CHECK y qué regla protegen.', a:'licencia_dates_order (vencimiento posterior a emisión o nulo), bloqueo_resolution_consistency (resuelto solo con quién y cuándo), personal_aeronautico_cedula_format (6 a 9 dígitos). También alerta_acknowledgement y el tamaño de adjuntos. Protegen reglas de negocio aunque el código cambie.' },
  { k:'T', z:'La Bóveda', q:'¿Cómo evitas que se borre un usuario que hizo cambios?', a:'auditoria.actor_id referencia a usuario con RESTRICT; PostgreSQL rechaza el borrado. Los usuarios se desactivan, nunca se borran, y además no se puede desactivar al último administrador activo (verificado con bloqueo de fila).' },
  { k:'P', z:'La Bóveda', q:'¿Qué datos de los catálogos son reales y cuáles ficticios?', a:'Los catálogos (tipos de licencia, habilitaciones, aeronaves, observaciones) se transcribieron de grabaciones del sistema SLYM del INAC y son reales en su vocabulario. Las personas, licencias y usuarios del seed son ficticios y deterministas (D25); no se migró ningún dato personal real.' },
  { k:'T', z:'La Rampa', q:'¿Cómo recuperas el sistema si se pierde la base de datos de producción?', a:'Se toma el último respaldo cifrado (hay uno diario con 30 días de retención), se restaura con restore.sh usando la clave privada custodiada fuera de los servidores, idealmente en una rama nueva de Neon o un PostgreSQL local, y se apuntan las variables de entorno de la API al nuevo destino. Como máximo se pierde un día (RPO 24 h). El procedimiento está probado por script y por simulacro.' },
  { k:'P', z:'La Rampa', q:'¿Cuánto cuesta operar el sistema?', a:'El software es libre. El entorno de validación corre en planes gratuitos de Render y Neon, con GitHub Actions para CI y respaldos. Para producción en el INAC, la opción recomendada es un servidor en la red local con docker compose, sin licencias de software.' },
  { k:'P', z:'La Academia', q:'¿Cuáles son tus objetivos específicos y cómo se cumplió cada uno?', a:'Diagnosticar (observación y censo de 9), determinar requerimientos (BR y NFR documentados y trazables a RAV 60/67 e ISO 25010), diseñar base de datos e interfaz (26 tablas con integridad referencial, UML, 6 plantillas y 15 páginas), programar los módulos (TypeScript, NestJS, React, PostgreSQL; 106 commits) y validar (más de 700 pruebas automáticas y validación con usuarios sobre el despliegue).' },
  { k:'P', z:'La Academia', q:'¿Qué aporta tu trabajo a la línea de Sistemas de Información Transaccionales?', a:'Un caso aplicado donde una regulación (RAV 60 y 67) se traduce a reglas transaccionales verificables: bloqueo preventivo, coherencia entre credenciales, estado derivado, auditoría inmutable por diseño de base de datos y parámetros regulatorios configurables en vez de constantes. Y una metodología de trazabilidad: cada regla cita su fuente y cada decisión tiene dueño.' },
  { k:'T', z:'El Hangar', q:'¿Cómo probaste la regla BR-07? Dame el nombre de una prueba.', a:'"answers 409 while the person has an active block (BR-07) and writes nothing" en licenses.int.test.ts: crea un bloqueo activo, intenta emitir por HTTP con supertest contra PostgreSQL real, espera 409 y verifica que no haya licencia ni auditoría de emisión. En la web, "shows an open block as the page state on arrival, with no form (BR-07)".' },
  { k:'T', z:'La Pista', q:'¿Qué pasa si el usuario pierde la conexión a mitad de un formulario?', a:'fetchJson lanza un ApiError de red; el contenedor pasa la plantilla a estado "error" con botón de reintento, sin perder el marco de la página. El formulario queda deshabilitado con aria-busy solo durante el envío. Como la operación es transaccional en el servidor, nunca queda a medias.' },
  { k:'P', z:'La Taquilla', q:'¿Qué harías distinto si empezaras de nuevo?', a:'Conseguir antes los números regulatorios de INAC (vigencias, umbral) y la validación de la matriz de permisos, para cerrar las decisiones abiertas; añadir pruebas de extremo a extremo con navegador real; y mantener el documento de diseño sincronizado con los tokens desde el inicio. Lo demás (contratos compartidos, auditoría en la base, estado derivado) lo repetiría.' },
];

// Preguntas incómodas: las que conviene tener respondidas con calma
const UNCOMFORTABLE = [
  { k:'P', q:'Esto es demasiado para una tesis de pregrado. ¿Lo hiciste tú?', a:`<p>Lo hice yo con las herramientas de ingeniería actuales: control de versiones, integración continua, generadores de migraciones y asistentes de código. Lo que define al ingeniero no es teclear cada línea sino decidir: qué reglas se implementan y por qué, qué se deja configurable, cómo se protege la auditoría, cómo se estructura el proyecto para que otros lo mantengan. Esas decisiones están documentadas con fecha y dueño (D1 a D25, OD-01 a OD-14) y puedo explicar cualquier módulo del sistema en el nivel de detalle que el jurado quiera.</p>`, tip:'Responde con calma y ofrece una demostración en vivo: abrir un servicio del backend y explicarlo línea a línea desarma la duda.' },
  { k:'P', q:'La tesis dice cascada, pero el repositorio muestra ramas paralelas, especificaciones y pruebas primero. ¿No es ágil?', a:`<p>Es cascada en lo que importa: requisitos y diseño se cerraron antes de codificar (definiciones, reglas BR/NFR, UML, runbook de diseño) y la codificación se planificó en olas con compuertas. Dentro de la fase de codificación se usó especificación por módulo y pruebas automáticas, que son prácticas de ingeniería compatibles con un modelo plan-driven; Sommerville las describe dentro de procesos dirigidos por plan. No hubo sprints ni replanteo de requisitos por iteración.</p>` },
  { k:'T', q:'¿Por qué no hay refresh token ni revocación de sesiones?', a:`<p>Decisión D4: con tokens de una hora, almacenamiento en sessionStorage y nueve usuarios en una oficina, la complejidad de un refresh token no se justificaba para la primera entrega. La desactivación de un usuario sí corta /auth/me y el cambio de contraseña. Está identificado como mejora si INAC define una política de cuentas (OD-12).</p>` },
  { k:'T', q:'¿Dónde está la política de contraseñas?', a:`<p>Mínimo de 10 caracteres, hash argon2id, contraseña temporal de 12 caracteres sin ambigüedades mostrada una sola vez y cambio obligatorio al primer acceso. Complejidad, caducidad y bloqueo de cuenta son política institucional y quedaron como decisión abierta (OD-12) para que INAC la defina; el sistema está preparado para aplicarla en un solo punto.</p>` },
  { k:'T', q:'Dijiste que la auditoría es inmutable, pero TRUNCATE no está bloqueado.', a:`<p>Correcto, y es deliberado: las pruebas limpian tablas con TRUNCATE. El trigger cubre UPDATE y DELETE fila a fila; TRUNCATE es un privilegio de tabla que el rol de producción no debe tener. Está anotado en la migración. La defensa completa es trigger más permisos de base de datos más respaldos diarios.</p>` },
  { k:'T', q:'¿Y la disponibilidad mayor al 99 % en un plan gratuito que se duerme?', a:`<p>El plan gratuito es el entorno de validación, no el de producción. La meta de disponibilidad aplica al despliegue en la red local del INAC propuesto en la tesis, donde el servicio corre en un servidor dedicado con docker compose, sin suspensión por inactividad. La arquitectura, las sondas de salud y los respaldos son los mismos en ambos entornos.</p>` },
  { k:'T', q:'¿Por qué guardar fotos en la base de datos? Es una mala práctica.', a:`<p>Depende del contexto. Con 9 usuarios, una sede y 200 KB por persona, guardarlas en bytea mantiene atomicidad con el resto del expediente, viaja en el mismo respaldo cifrado y evita un servicio de almacenamiento adicional que el hosting no ofrece gratis. Si el volumen crece, el cambio es local: mover los bytes a almacenamiento de objetos y conservar la referencia. La decisión está documentada (D5).</p>` },
  { k:'T', q:'¿Cuál es tu cobertura de pruebas?', a:`<p>No se fijó un umbral numérico de cobertura (es cero en la configuración). Lo que hay son 92 archivos y unos 720 casos que cubren las reglas de negocio críticas con PostgreSQL real: bloqueo en emisión, coherencia médica, auditoría transaccional, permisos por rol y área, constraints del esquema, restauración de respaldos. Preferí pruebas de comportamiento sobre un porcentaje de líneas.</p>` },
  { k:'P', q:'Los números de vigencia están "pendientes". ¿Entonces el sistema no funciona?', a:`<p>Funciona completo con valores provisionales señalados como tales; cuando INAC los entregue se cargan desde la pantalla de parámetros o el catálogo, con auditoría, sin tocar código. Es lo opuesto a inventar un número regulatorio en una tesis de seguridad operacional.</p>` },
  { k:'T', q:'Hay dos pruebas de integración que fallan. ¿Por qué?', a:`<p>Son conocidas y anteriores al último refactor: una exportación de reporte sin ORDER BY cuyo orden depende de la base local, y una comparación de placeholder contra datos del seed local. No afectan a la lógica de negocio, están registradas en el documento del refactor y son el siguiente arreglo en la lista.</p>` },
  { k:'P', q:'DESIGN.md dice una cosa y la interfaz muestra otra (gris versus azul INAC).', a:`<p>Sí: el documento de diseño describe la dirección inicial monocroma y la implementación adoptó después el azul institucional como único acento (convenciones de UI). El código es la fuente de verdad y el documento se actualizará; no hay contradicción funcional, solo documental.</p>` },
  { k:'T', q:'¿Por qué no hay pruebas de extremo a extremo con navegador?', a:`<p>Estaban planificadas (Playwright en la ola de cierre) y no llegaron a esta entrega. Lo cubren parcialmente las pruebas de la web con Testing Library que montan la aplicación completa con una API simulada, y las de integración HTTP del backend. Es la primera mejora de calidad propuesta.</p>` },
  { k:'P', q:'¿Qué pasa con la privacidad de los datos médicos?', a:`<p>No existen datos médicos clínicos en el sistema: solo clase del certificado, fechas y restricciones operativas generales (BR-05). Los esquemas rechazan campos extra y una prueba verifica que la tabla no tenga columnas clínicas. El acceso requiere sesión y rol, todo queda auditado y los respaldos van cifrados.</p>` },
];
</script>
<script>
// ===== Estado, XP y navegación =====
const RANKS = [[0,'Aspirante','Recién llegado a la Taquilla'],[150,'Taquillero','Ya registras expedientes sin temblar'],[400,'Inspector de Rampa','Verificas credenciales de un vistazo'],[800,'Supervisor','Resuelves bloqueos y defiendes decisiones'],[1300,'Ingeniero de Sistemas','Listo para el jurado']];
const XP = { card:5, jury:10, quiz:20, boss:15 };
const KEY = 'sryg.ruta.v1';
let S = { xp:0, cards:{}, jury:{}, quiz:{}, boss:{}, view:'map' };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT; function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }
function gain(n, why) { S.xp += n; save(); renderHud(); toast(`+${n} XP · ${why}`); }
function zoneProgress(id) {
  const z = ZONES.find(z => z.id === id); if (!z) return 0;
  if (z.boss) { const total = BOSS.length; const done = Object.values(S.boss).filter(Boolean).length; return Math.round(100 * done / total); }
  const total = z.cards.length + z.jury.length + z.quiz.length;
  const done = z.cards.filter((_, i) => S.cards[id + ':' + i]).length + z.jury.filter((_, i) => S.jury[id + ':' + i]).length + z.quiz.filter((_, i) => S.quiz[id + ':' + i] === 'ok').length;
  return Math.round(100 * done / total);
}
function rankFor(xp) { let r = RANKS[0], next = null; for (let i = 0; i < RANKS.length; i++) { if (xp >= RANKS[i][0]) r = RANKS[i]; else { next = RANKS[i]; break; } } return { r, next }; }
function renderHud() {
  const { r, next } = rankFor(S.xp);
  $('#rank').textContent = r[1]; $('#rankhint').textContent = r[2];
  $('#xplab').textContent = `${S.xp} XP`;
  $('#nextlab').textContent = next ? `siguiente rango: ${next[0]} XP` : 'rango máximo';
  const lo = r[0], hi = next ? next[0] : Math.max(S.xp, lo + 1);
  $('#xpfill').style.width = Math.min(100, Math.round(100 * (S.xp - lo) / (hi - lo))) + '%';
  const av = avatarSrc(); const avBox = $('#hud .avatar');
  if (av && !avBox.querySelector('img')) { const img = document.createElement('img'); img.alt = 'Personaje de Junco'; img.src = av; img.onerror = () => img.remove(); avBox.replaceChildren(img); }
  else if (av && avBox.querySelector('img') && avBox.querySelector('img').getAttribute('src') !== av) avBox.querySelector('img').src = av;
  $('#badges').innerHTML = ZONES.map(z => `<span class="badge ${zoneProgress(z.id) >= 100 ? 'on' : ''}" title="${esc(z.name)} ${zoneProgress(z.id)}%">${z.icon}</span>`).join('');
  $('#btnHome').hidden = S.view === 'map';
}
const NPC_NAME = 'El Pana de Taquilla';
const npcSvg = '<svg viewBox="0 0 40 40"><circle cx="20" cy="15" r="9" fill="#f6d2b0"/><path d="M11 13c0-7 18-7 18 0v3c-3-5-15-5-18 0z" fill="#3b2a1e"/><circle cx="16" cy="16" r="1.4"/><circle cx="24" cy="16" r="1.4"/><path d="M15 20q5 4 10 0" stroke="#7a3b2a" stroke-width="1.6" fill="none"/><path d="M6 38c1-9 7-12 14-12s13 3 14 12z" fill="#2f7d4e"/><rect x="17" y="27" width="6" height="7" fill="#ffe9a8"/></svg>';
function npc(say) { return `<div class="npc"><div class="face" aria-hidden="true">${npcSvg}</div><div><div class="name">${NPC_NAME}</div><p class="say">${say}</p></div></div>`; }
function pick(arr, salt) { return arr[(S.xp + salt) % arr.length]; }

function renderMap() {
  S.view = 'map'; save(); renderHud();
  const total = Math.round(ZONES.reduce((a, z) => a + zoneProgress(z.id), 0) / ZONES.length);
  const bossReady = ZONES.filter(z => !z.boss).every(z => zoneProgress(z.id) >= 60);
  $('#main').innerHTML = `
  <section class="hero">
    <div class="intro">
      <div><h1>Ruta de Defensa SRYG</h1><p class="lead">Nueve zonas, una isla. Cada casita guarda lo que el jurado de producto y el jurado técnico pueden preguntarte sobre la tesis y el sistema. Lee las tarjetas, domina las preguntas de jurado, pasa el quiz y gana XP. La Sala del Jurado se abre al tener cada zona al menos al 60%.</p></div>
      <div><span class="pill">Progreso total ${total}%</span></div>
    </div>
    ${npc(pick(JOKES.map, 1))}
    <div class="mapbox" id="mapbox">${MAP.build(ZONES, zoneProgress, avatarSrc())}</div>
    <div class="zonelist">${ZONES.map((z, i) => `<button class="zcard ${z.boss && !bossReady ? 'locked' : ''}" data-zone="${z.id}"><span class="ico">${z.icon}</span><span><span class="t">${i + 1}. ${z.name}</span><br><span class="s">${esc(z.tag)}</span></span><span class="pct">${zoneProgress(z.id)}%</span></button>`).join('')}</div>
  </section>`;
  const open = id => { const z = ZONES.find(z => z.id === id); if (z.boss && !bossReady) { toast('La Sala del Jurado se abre con todas las zonas al 60% o más. ¡Échale pichón!'); return; } location.hash = id; renderZone(id); };
  document.querySelectorAll('[data-zone]').forEach(el => { el.addEventListener('click', () => open(el.dataset.zone)); el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(el.dataset.zone); } }); });
  window.scrollTo({ top: 0 });
}

function renderZone(id, tab = 'cards') {
  const z = ZONES.find(z => z.id === id); if (!z) return renderMap();
  S.view = id; save(); renderHud();
  const idx = ZONES.indexOf(z);
  const tabs = z.boss ? [['boss','Simulacro'],['jury','Preguntas incómodas']] : [['cards',`Tarjetas (${z.cards.filter((_, i) => S.cards[id + ':' + i]).length}/${z.cards.length})`],['jury',`Jurado (${z.jury.filter((_, i) => S.jury[id + ':' + i]).length}/${z.jury.length})`],['quiz',`Quiz (${z.quiz.filter((_, i) => S.quiz[id + ':' + i] === 'ok').length}/${z.quiz.length})`]];
  if (!tabs.some(t => t[0] === tab)) tab = tabs[0][0];
  $('#main').innerHTML = `
  <section class="zone-view">
    <div class="zhead">
      <div><div class="kicker">Zona ${idx + 1} de ${ZONES.length} · ${esc(z.tag)}</div><h2>${z.icon} ${z.name}</h2><p class="note">${z.intro}</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><span class="pill">${zoneProgress(id)}%</span>${idx > 0 ? `<button class="btn small" data-go="${ZONES[idx - 1].id}">← ${ZONES[idx - 1].name}</button>` : ''}${idx < ZONES.length - 1 ? `<button class="btn small" data-go="${ZONES[idx + 1].id}">${ZONES[idx + 1].name} →</button>` : ''}</div>
    </div>
    ${npc(pick(z.jokes || JOKES.zone, idx))}
    <div class="tabs" role="tablist">${tabs.map(t => `<button class="tab" role="tab" aria-selected="${t[0] === tab}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div>
    <div class="panel" id="panel"></div>
  </section>`;
  document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { location.hash = b.dataset.go; renderZone(b.dataset.go); }));
  document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => renderZone(id, b.dataset.tab)));
  const p = $('#panel');
  if (tab === 'cards') renderCards(z, p); else if (tab === 'jury') renderJury(z, p); else if (tab === 'quiz') renderQuiz(z, p); else renderBoss(z, p);
  window.scrollTo({ top: 0 });
}

function renderCards(z, p) {
  p.innerHTML = `<div class="cards">${z.cards.map((c, i) => { const k = z.id + ':' + i, read = !!S.cards[k]; return `<article class="card ${read ? 'read' : ''}"><h3><span class="num">${i + 1}</span>${c.t}</h3>${c.b}${c.why ? `<div class="why"><b>¿Por qué?</b> ${c.why}</div>` : ''}<div class="foot"><span class="note">${c.src ? 'Fuente: ' + esc(c.src) : ''}</span><button class="btn small" data-card="${i}">${read ? '✓ Entendido' : 'Entendido (+5 XP)'}</button></div></article>`; }).join('')}</div>`;
  p.querySelectorAll('[data-card]').forEach(b => b.addEventListener('click', () => { const k = z.id + ':' + b.dataset.card; if (S.cards[k]) { delete S.cards[k]; save(); } else { S.cards[k] = 1; gain(XP.card, 'tarjeta leída'); } renderZone(z.id, 'cards'); }));
}
function renderJury(z, p) {
  const list = z.boss ? UNCOMFORTABLE : z.jury;
  p.innerHTML = `<p class="note">Cada pregunta trae una respuesta modelo. Léela en voz alta, con tus palabras, y márcala como dominada cuando la puedas explicar sin mirar. <b>P</b> = jurado de producto, <b>T</b> = jurado técnico.</p><div class="jury">${list.map((q, i) => { const k = z.id + ':' + i, ok = !!S.jury[k]; return `<details class="q ${q.k === 'P' ? 'product' : 'tech'} ${ok ? 'ok' : ''}"><summary><span class="ask">${q.k}</span><span>${q.q}</span></summary><div class="ans">${q.a}${q.tip ? `<div class="tip">💡 ${q.tip}</div>` : ''}<div class="grade"><button class="btn small ${ok ? 'primary' : ''}" data-jury="${i}">${ok ? '✓ La domino' : 'La domino (+10 XP)'}</button></div></div></details>`; }).join('')}</div>`;
  p.querySelectorAll('[data-jury]').forEach(b => b.addEventListener('click', e => { const k = z.id + ':' + b.dataset.jury; if (S.jury[k]) { delete S.jury[k]; save(); } else { S.jury[k] = 1; gain(XP.jury, 'pregunta de jurado dominada'); } renderZone(z.id, 'jury'); }));
}
function renderQuiz(z, p) {
  p.innerHTML = `<p class="note">Una sola respuesta correcta por pregunta. La primera vez que aciertas ganas 20 XP; si fallas, lee la explicación y vuelve a intentar.</p><div class="quiz">${z.quiz.map((q, i) => { const k = z.id + ':' + i, st = S.quiz[k]; return `<div class="qq" data-q="${i}"><div><b>${i + 1}.</b> ${q.q}</div><div class="opts">${q.o.map((o, j) => `<button class="opt ${st === 'ok' && j === q.a ? 'right' : ''}" data-opt="${j}" ${st === 'ok' ? 'disabled' : ''}><span class="k">${'ABCD'[j]}</span><span>${o}</span></button>`).join('')}</div>${st === 'ok' ? `<div class="exp">✓ ${q.e}</div>` : ''}</div>`; }).join('')}</div>`;
  p.querySelectorAll('.qq').forEach(box => { const i = +box.dataset.q, q = z.quiz[i], k = z.id + ':' + i; box.querySelectorAll('[data-opt]').forEach(b => b.addEventListener('click', () => { const j = +b.dataset.opt; if (j === q.a) { if (S.quiz[k] !== 'ok') { S.quiz[k] = 'ok'; gain(XP.quiz, 'quiz acertado'); } else save(); renderZone(z.id, 'quiz'); } else { b.classList.add('wrong'); S.quiz[k] = 'fail'; save(); let ex = box.querySelector('.exp'); if (!ex) { ex = document.createElement('div'); ex.className = 'exp'; box.appendChild(ex); } ex.innerHTML = '✗ Todavía no. ' + q.e; } })); });
}
let bossOrder = null, bossI = 0;
function renderBoss(z, p) {
  if (!bossOrder) { bossOrder = BOSS.map((_, i) => i); for (let i = bossOrder.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [bossOrder[i], bossOrder[j]] = [bossOrder[j], bossOrder[i]]; } bossI = 0; }
  const done = Object.values(S.boss).filter(Boolean).length, pend = BOSS.length - done;
  const qi = bossOrder[bossI % bossOrder.length], q = BOSS[qi];
  p.innerHTML = `<div class="boss">
    <div class="score"><div class="s"><b>${done}</b>dominadas</div><div class="s"><b>${pend}</b>por repasar</div><div class="s"><b>${BOSS.length}</b>preguntas</div></div>
    <div class="arena"><div class="meta"><span class="pill ${q.k === 'P' ? '' : ''}">${q.k === 'P' ? 'Jurado de producto' : 'Jurado técnico'} · ${esc(q.z)}</span><span class="note">${bossI + 1} / ${BOSS.length}</span></div>
      <div class="flash"><div class="qtext">${q.q}</div><div id="bossAns" hidden><div class="exp">${q.a}</div></div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="bShow">Ver respuesta modelo</button><button class="btn" id="bOk">La respondí bien (+15 XP)</button><button class="btn" id="bNo">Repasar luego</button><button class="btn small" id="bShuffle">Barajar</button></div>
    </div>
    <p class="note">Consejo de defensa: responde en tres pasos. 1) La decisión o el hecho. 2) El porqué (norma, requisito, riesgo). 3) Dónde vive en el sistema (módulo, tabla, pantalla). Si no sabes un número, di que es un parámetro configurable pendiente de INAC: es verdad y está en el código.</p>
  </div>`;
  $('#bShow').addEventListener('click', () => { $('#bossAns').hidden = false; });
  $('#bOk').addEventListener('click', () => { if (!S.boss[qi]) { S.boss[qi] = 1; gain(XP.boss, 'pregunta de jurado superada'); } bossI++; renderZone(z.id, 'boss'); });
  $('#bNo').addEventListener('click', () => { S.boss[qi] = 0; save(); bossI++; renderZone(z.id, 'boss'); });
  $('#bShuffle').addEventListener('click', () => { bossOrder = null; renderZone(z.id, 'boss'); });
}
// Personaje: por defecto assets/junco.png junto a la página; se puede sustituir con una imagen propia guardada en el navegador.
const DEFAULT_AVATAR = 'assets/junco.png';
function avatarSrc() { return S.avatar || DEFAULT_AVATAR; }
$('#avatarFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const max = 192, k = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    S.avatar = c.toDataURL('image/png'); save(); URL.revokeObjectURL(img.src);
    toast('Personaje listo. ¡Ese sí es Junco, chamo!'); if (S.view === 'map') renderMap(); else renderHud();
  };
  img.onerror = () => toast('No pude leer esa imagen. Prueba con un PNG o JPG.');
  img.src = URL.createObjectURL(f);
});
$('#btnHome').addEventListener('click', () => { location.hash = ''; renderMap(); });
$('#btnReset').addEventListener('click', () => { if ($('#btnReset').dataset.arm) { S = { xp:0, cards:{}, jury:{}, quiz:{}, boss:{}, view:'map' }; save(); delete $('#btnReset').dataset.arm; $('#btnReset').textContent = 'Reiniciar'; renderMap(); toast('Progreso reiniciado. Empezamos de cero, chamo.'); } else { $('#btnReset').dataset.arm = '1'; $('#btnReset').textContent = '¿Seguro? Pulsa otra vez'; setTimeout(() => { delete $('#btnReset').dataset.arm; $('#btnReset').textContent = 'Reiniciar'; }, 3000); } });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && ZONES.some(z => z.id === h)) renderZone(h); else renderMap(); });
(function boot() { const h = location.hash.slice(1); if (h && ZONES.some(z => z.id === h)) renderZone(h); else renderMap(); })();
</script>
