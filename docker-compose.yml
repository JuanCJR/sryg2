# Local development database only. Production uses Neon (see docs/deploy.md).
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: sryg
      POSTGRES_PASSWORD: sryg
      POSTGRES_DB: sryg
    ports:
      - '5432:5432'
    volumes:
      - sryg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sryg -d sryg']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sryg_pgdata:
